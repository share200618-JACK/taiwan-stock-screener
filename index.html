<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>台股智慧選股 · 儀表板</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700;900&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg:    #080b12;
  --bg2:   #0d1120;
  --bg3:   #121828;
  --bdr:   #1a2235;
  --bdr2:  #232d42;
  --red:   #f03e4d;
  --grn:   #1bc47d;
  --gold:  #f0b429;
  --blue:  #3d8bff;
  --pur:   #a855f7;
  --dim:   #3a4560;
  --muted: #5a6888;
  --txt:   #b8c4dc;
  --white: #e4eaf5;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{
  background:var(--bg);color:var(--txt);
  font-family:'Noto Sans TC',sans-serif;
  min-height:100vh;
  background-image:
    radial-gradient(ellipse 80% 50% at 50% -20%, rgba(61,139,255,.07) 0%, transparent 60%),
    radial-gradient(ellipse 40% 30% at 80% 80%, rgba(168,85,247,.04) 0%, transparent 50%);
}

/* ── 頂部導覽 ── */
.topbar{
  position:sticky;top:0;z-index:100;
  background:rgba(8,11,18,.85);
  backdrop-filter:blur(20px);
  border-bottom:1px solid var(--bdr);
  padding:0 20px;
  display:flex;align-items:center;justify-content:space-between;
  height:52px;
}
.logo{
  display:flex;align-items:center;gap:10px;
  text-decoration:none;
}
.logo-icon{
  width:30px;height:30px;border-radius:8px;
  background:linear-gradient(135deg,#3d8bff,#a855f7);
  display:flex;align-items:center;justify-content:center;
  font-size:.9rem;box-shadow:0 0 16px rgba(61,139,255,.3);
}
.logo-text{
  font-size:.88rem;font-weight:700;color:var(--white);
  font-family:'JetBrains Mono',monospace;letter-spacing:-.5px;
}
.nav-links{display:flex;gap:4px;align-items:center;}
.nav-link{
  padding:5px 11px;border-radius:6px;font-size:.72rem;font-weight:600;
  color:var(--muted);text-decoration:none;transition:all .15s;
  border:1px solid transparent;
}
.nav-link:hover{color:var(--txt);background:var(--bg3);}
.nav-link.active{color:var(--blue);border-color:rgba(61,139,255,.25);background:rgba(61,139,255,.08);}
.date-chip{
  font-size:.65rem;color:var(--muted);
  font-family:'JetBrains Mono',monospace;
  padding:3px 8px;background:var(--bg3);border:1px solid var(--bdr);border-radius:5px;
}

/* ── 主容器 ── */
.container{max-width:1100px;margin:0 auto;padding:16px 20px 40px;}

/* ── Section 標題 ── */
.section-hd{
  display:flex;align-items:center;justify-content:space-between;
  margin-bottom:10px;
}
.section-title{
  font-size:.72rem;font-weight:700;color:var(--muted);
  text-transform:uppercase;letter-spacing:1px;
  display:flex;align-items:center;gap:6px;
}
.section-title::before{
  content:'';width:3px;height:12px;border-radius:2px;
  background:linear-gradient(135deg,var(--blue),var(--pur));
}
.refresh-btn{
  font-size:.65rem;color:var(--dim);cursor:pointer;
  padding:3px 8px;border:1px solid var(--bdr);border-radius:5px;
  background:none;transition:all .15s;
  font-family:'Noto Sans TC',sans-serif;
}
.refresh-btn:hover{color:var(--txt);border-color:var(--muted);}

/* ── 大盤指數 ── */
.indices-grid{
  display:grid;grid-template-columns:repeat(6,1fr);gap:8px;
  margin-bottom:20px;
}
.idx-card{
  background:var(--bg2);border:1px solid var(--bdr);border-radius:10px;
  padding:10px 12px;transition:border-color .15s;
}
.idx-card:hover{border-color:var(--bdr2);}
.idx-name{font-size:.62rem;color:var(--muted);margin-bottom:5px;white-space:nowrap;}
.idx-val{
  font-size:.9rem;font-weight:700;
  font-family:'JetBrains Mono',monospace;color:var(--white);
}
.idx-chg{
  font-size:.65rem;font-family:'JetBrains Mono',monospace;
  margin-top:3px;display:flex;align-items:center;gap:3px;
}
.idx-loading{
  height:44px;background:var(--bg3);border-radius:6px;
  animation:shimmer 1.5s infinite;
}
@keyframes shimmer{
  0%{opacity:.4}50%{opacity:.8}100%{opacity:.4}
}

/* ── 主體雙欄 ── */
.main-grid{
  display:grid;grid-template-columns:1fr 340px;gap:14px;
  margin-bottom:20px;
}

/* ── AI 分析結果 ── */
.ai-panel{
  background:var(--bg2);border:1px solid var(--bdr);border-radius:12px;
  overflow:hidden;
}
.ai-panel-header{
  padding:12px 16px 10px;
  border-bottom:1px solid var(--bdr);
  display:flex;align-items:center;justify-content:space-between;
}
.ai-meta{font-size:.65rem;color:var(--muted);}
.market-badge{
  padding:2px 8px;border-radius:5px;font-size:.63rem;font-weight:700;
  font-family:'JetBrains Mono',monospace;
}
.ai-stats{
  display:grid;grid-template-columns:repeat(4,1fr);
  border-bottom:1px solid var(--bdr);
}
.ai-stat{
  padding:8px 12px;text-align:center;border-right:1px solid var(--bdr);
}
.ai-stat:last-child{border-right:none;}
.as-num{font-size:.95rem;font-weight:700;font-family:'JetBrains Mono',monospace;}
.as-lbl{font-size:.6rem;color:var(--muted);margin-top:1px;}
.ai-stocks{padding:4px 8px;}
.ai-stock-row{
  display:grid;grid-template-columns:28px 1fr 60px 70px 70px;
  align-items:center;gap:6px;
  padding:7px 8px;border-radius:7px;cursor:pointer;
  transition:background .12s;
}
.ai-stock-row:hover{background:rgba(255,255,255,.03);}
.rank-num{
  font-size:.65rem;color:var(--dim);text-align:center;
  font-family:'JetBrains Mono',monospace;
}
.stock-info .sname{font-size:.8rem;font-weight:600;color:var(--white);}
.stock-info .scode{font-size:.62rem;color:var(--muted);}
.prob-bar-wrap{position:relative;}
.prob-bar-bg{
  background:var(--bg3);border-radius:3px;height:5px;overflow:hidden;
}
.prob-bar{height:100%;border-radius:3px;background:linear-gradient(90deg,var(--blue),var(--pur));}
.prob-val{
  font-size:.68rem;font-weight:700;font-family:'JetBrains Mono',monospace;
  color:var(--blue);text-align:right;margin-top:2px;
}
.price-col{
  font-size:.78rem;font-weight:600;font-family:'JetBrains Mono',monospace;
  text-align:right;
}
.chg-col{
  font-size:.68rem;font-weight:700;font-family:'JetBrains Mono',monospace;
  text-align:right;padding:2px 6px;border-radius:4px;
}
.up{color:var(--red);}
.dn{color:var(--grn);}
.up-bg{background:rgba(240,62,77,.12);color:var(--red);}
.dn-bg{background:rgba(27,196,125,.12);color:var(--grn);}

/* ── 新聞 ── */
.news-panel{
  background:var(--bg2);border:1px solid var(--bdr);border-radius:12px;
  overflow:hidden;display:flex;flex-direction:column;
}
.news-header{
  padding:12px 16px 10px;border-bottom:1px solid var(--bdr);
  display:flex;align-items:center;justify-content:space-between;
  flex-shrink:0;
}
.news-list{overflow-y:auto;flex:1;}
.news-item{
  padding:10px 16px;border-bottom:1px solid var(--bdr);
  cursor:pointer;transition:background .12s;
  text-decoration:none;display:block;
}
.news-item:last-child{border-bottom:none;}
.news-item:hover{background:rgba(255,255,255,.03);}
.news-num{
  font-size:.58rem;color:var(--dim);margin-bottom:3px;
  font-family:'JetBrains Mono',monospace;
}
.news-title{
  font-size:.75rem;color:var(--txt);line-height:1.45;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
}
.news-time{font-size:.6rem;color:var(--dim);margin-top:4px;}

/* ── 底部快捷工具 ── */
.tools-grid{
  display:grid;grid-template-columns:repeat(4,1fr);gap:10px;
}
.tool-card{
  background:var(--bg2);border:1px solid var(--bdr);border-radius:12px;
  padding:16px;text-decoration:none;
  display:flex;align-items:center;gap:12px;
  transition:all .15s;
}
.tool-card:hover{border-color:var(--bdr2);background:var(--bg3);transform:translateY(-1px);}
.tool-icon{
  width:38px;height:38px;border-radius:10px;
  display:flex;align-items:center;justify-content:center;
  font-size:1.1rem;flex-shrink:0;
}
.tool-text .ttitle{font-size:.8rem;font-weight:700;color:var(--white);}
.tool-text .tdesc{font-size:.65rem;color:var(--muted);margin-top:2px;}

/* ── 空狀態/Loading ── */
.loading-rows{padding:8px;}
.loading-row{
  height:40px;background:var(--bg3);border-radius:7px;
  margin-bottom:6px;animation:shimmer 1.5s infinite;
}
.loading-row:nth-child(2){animation-delay:.15s;}
.loading-row:nth-child(3){animation-delay:.3s;}

@media(max-width:768px){
  .indices-grid{grid-template-columns:repeat(3,1fr);}
  .main-grid{grid-template-columns:1fr;}
  .news-panel{max-height:320px;}
  .tools-grid{grid-template-columns:repeat(2,1fr);}
  .ai-stats{grid-template-columns:repeat(2,1fr);}
  .ai-stock-row{grid-template-columns:24px 1fr 55px 60px;}
}
@media(max-width:480px){
  .indices-grid{grid-template-columns:repeat(2,1fr);}
  .topbar{padding:0 12px;}
  .container{padding:12px 12px 32px;}
}
</style>
</head>
<body>

<div class="topbar">
  <a href="/" class="logo">
    <div class="logo-icon">📊</div>
    <span class="logo-text">TW·Stock</span>
  </a>
  <nav class="nav-links">
    <a href="/" class="nav-link active">🏠 儀表板</a>
    <a href="/analyze" class="nav-link">🤖 AI分析</a>
    <a href="/reversal" class="nav-link">🔄 底部反轉</a>
    <a href="/watchlist" class="nav-link">👁️ 追蹤清單</a>
  </nav>
  <div class="date-chip" id="datechip">—</div>
</div>

<div class="container">

  <!-- 大盤指數 -->
  <div class="section-hd" style="margin-top:6px;">
    <div class="section-title">大盤指數</div>
    <button class="refresh-btn" onclick="loadIndices()">↻ 刷新</button>
  </div>
  <div class="indices-grid" id="indicesGrid">
    <div class="idx-card"><div class="idx-loading"></div></div>
    <div class="idx-card"><div class="idx-loading"></div></div>
    <div class="idx-card"><div class="idx-loading"></div></div>
    <div class="idx-card"><div class="idx-loading"></div></div>
    <div class="idx-card"><div class="idx-loading"></div></div>
    <div class="idx-card"><div class="idx-loading"></div></div>
  </div>

  <!-- 主體：AI分析 + 新聞 -->
  <div class="main-grid">

    <!-- AI 分析結果 -->
    <div class="ai-panel">
      <div class="ai-panel-header">
        <div>
          <div style="font-size:.82rem;font-weight:700;color:var(--white);">🤖 AI 選股結果</div>
          <div class="ai-meta" id="aiMeta">載入中...</div>
        </div>
        <div id="marketBadge"></div>
      </div>
      <div class="ai-stats" id="aiStats">
        <div class="ai-stat"><div class="as-num" style="color:var(--blue);">—</div><div class="as-lbl">掃描支數</div></div>
        <div class="ai-stat"><div class="as-num" style="color:var(--pur);">—</div><div class="as-lbl">平均準確率</div></div>
        <div class="ai-stat"><div class="as-num" style="color:var(--red);">—</div><div class="as-lbl">看漲</div></div>
        <div class="ai-stat"><div class="as-num" style="color:var(--grn);">—</div><div class="as-lbl">看跌</div></div>
      </div>
      <div class="ai-stocks" id="aiStocks">
        <div class="loading-rows">
          <div class="loading-row"></div>
          <div class="loading-row"></div>
          <div class="loading-row"></div>
        </div>
      </div>
    </div>

    <!-- 財經新聞 -->
    <div class="news-panel">
      <div class="news-header">
        <div style="font-size:.82rem;font-weight:700;color:var(--white);">📰 財經新聞</div>
        <button class="refresh-btn" onclick="loadNews()">↻</button>
      </div>
      <div class="news-list" id="newsList">
        <div class="loading-rows" style="padding:12px;">
          <div class="loading-row"></div>
          <div class="loading-row"></div>
          <div class="loading-row"></div>
          <div class="loading-row"></div>
        </div>
      </div>
    </div>

  </div>

  <!-- 快捷工具 -->
  <div class="section-hd">
    <div class="section-title">快捷工具</div>
  </div>
  <div class="tools-grid">
    <a href="/analyze" class="tool-card">
      <div class="tool-icon" style="background:linear-gradient(135deg,rgba(168,85,247,.2),rgba(124,58,237,.1));border:1px solid rgba(168,85,247,.2);">🤖</div>
      <div class="tool-text">
        <div class="ttitle">AI 全市場分析</div>
        <div class="tdesc">v2.0 強化版 · 每日22:00自動執行</div>
      </div>
    </a>
    <a href="/reversal" class="tool-card">
      <div class="tool-icon" style="background:linear-gradient(135deg,rgba(240,62,77,.2),rgba(183,28,28,.1));border:1px solid rgba(240,62,77,.2);">🔄</div>
      <div class="tool-text">
        <div class="ttitle">底部反轉選股</div>
        <div class="tdesc">v4.0 · 五條件硬過濾</div>
      </div>
    </a>
    <a href="/watchlist" class="tool-card">
      <div class="tool-icon" style="background:linear-gradient(135deg,rgba(27,196,125,.2),rgba(17,153,142,.1));border:1px solid rgba(27,196,125,.2);">👁️</div>
      <div class="tool-text">
        <div class="ttitle">我的追蹤清單</div>
        <div class="tdesc">追蹤個股 · 即時報酬追蹤</div>
      </div>
    </a>
    <a href="/analyze#backtest" class="tool-card">
      <div class="tool-icon" style="background:linear-gradient(135deg,rgba(61,139,255,.2),rgba(30,100,200,.1));border:1px solid rgba(61,139,255,.2);">📈</div>
      <div class="tool-text">
        <div class="ttitle">回測驗證</div>
        <div class="tdesc">2020-2024 歷史驗證</div>
      </div>
    </a>
  </div>

</div>

<script>
const API = location.hostname==='localhost' ? 'http://localhost:5000' : '';

// ── 日期時間 ──────────────────────────────────────────
function updateClock() {
  const now = new Date();
  const tw  = new Date(now.toLocaleString('en-US',{timeZone:'Asia/Taipei'}));
  const fmt = tw.toLocaleDateString('zh-TW',{year:'numeric',month:'2-digit',day:'2-digit',weekday:'short'});
  const hm  = tw.toLocaleTimeString('zh-TW',{hour:'2-digit',minute:'2-digit'});
  document.getElementById('datechip').textContent = `${fmt} ${hm}`;
}
updateClock(); setInterval(updateClock,10000);

// ── 大盤指數 ──────────────────────────────────────────
async function loadIndices() {
  try {
    const r = await fetch(`${API}/api/dashboard/indices`);
    const d = await r.json();
    const order = ['twii','tpex','tw50','elec','semi','fin'];
    const fmt = v => v >= 1000 ? v.toLocaleString('en',{maximumFractionDigits:2}) : v.toFixed(2);
    document.getElementById('indicesGrid').innerHTML = order.map(k => {
      const idx = d[k] || {name:'—',value:0,chg:0,pct:0};
      const up  = idx.pct >= 0;
      const col = idx.pct === 0 ? 'var(--muted)' : up ? 'var(--red)' : 'var(--grn)';
      return `<div class="idx-card">
        <div class="idx-name">${idx.name}</div>
        <div class="idx-val" style="color:${col};">${idx.value ? fmt(idx.value) : '—'}</div>
        <div class="idx-chg" style="color:${col};">
          ${idx.pct!==0?(up?'▲':'▼'):''}
          ${idx.chg!==0?Math.abs(idx.chg).toLocaleString('en',{maximumFractionDigits:2}):''}
          <span>(${idx.pct>0?'+':''}${idx.pct}%)</span>
        </div>
      </div>`;
    }).join('');
  } catch(e) {
    document.getElementById('indicesGrid').innerHTML =
      '<div style="grid-column:1/-1;text-align:center;color:var(--dim);padding:16px;font-size:.72rem;">指數載入失敗，請稍後重試</div>';
  }
}

// ── AI 分析摘要 ──────────────────────────────────────
async function loadAISummary() {
  try {
    const r = await fetch(`${API}/api/dashboard/summary`);
    const d = await r.json();
    if (d.error) { showAIEmpty(d.error); return; }

    // 大盤狀態
    const msMap = {
      bull:  {label:'多頭市場',color:'var(--red)',bg:'rgba(240,62,77,.12)',bdr:'rgba(240,62,77,.25)'},
      bear:  {label:'空頭市場',color:'var(--grn)',bg:'rgba(27,196,125,.12)',bdr:'rgba(27,196,125,.25)'},
      range: {label:'盤整市場',color:'var(--gold)',bg:'rgba(240,180,41,.12)',bdr:'rgba(240,180,41,.25)'},
    };
    const ms = msMap[d.market_state] || msMap.range;
    document.getElementById('marketBadge').innerHTML =
      `<span style="padding:3px 9px;border-radius:5px;font-size:.65rem;font-weight:700;
        background:${ms.bg};color:${ms.color};border:1px solid ${ms.bdr};">
        ${ms.label}
      </span>`;

    document.getElementById('aiMeta').textContent =
      `${d.date} ${d.time} · 掃描 ${d.total_scanned} 支`;

    document.getElementById('aiStats').innerHTML = `
      <div class="ai-stat"><div class="as-num" style="color:var(--blue);">${d.total_scanned}</div><div class="as-lbl">掃描支數</div></div>
      <div class="ai-stat"><div class="as-num" style="color:var(--pur);">${d.avg_accuracy}%</div><div class="as-lbl">平均準確率</div></div>
      <div class="ai-stat"><div class="as-num" style="color:var(--red);">${d.bullish}</div><div class="as-lbl">看漲</div></div>
      <div class="ai-stat"><div class="as-num" style="color:var(--grn);">${d.bearish}</div><div class="as-lbl">看跌</div></div>
    `;

    const stocks = d.stocks || [];
    if (!stocks.length) { showAIEmpty('尚無推薦股票'); return; }

    document.getElementById('aiStocks').innerHTML =
      `<div style="display:grid;grid-template-columns:28px 1fr 60px 70px 70px;
        gap:6px;padding:4px 8px 2px;border-bottom:1px solid var(--bdr);">
        <div></div>
        <div style="font-size:.6rem;color:var(--dim);">股票</div>
        <div style="font-size:.6rem;color:var(--dim);">上漲機率</div>
        <div style="font-size:.6rem;color:var(--dim);text-align:right;">股價</div>
        <div style="font-size:.6rem;color:var(--dim);text-align:right;">漲跌</div>
      </div>` +
      stocks.map((s,i) => {
        const up  = s.chg_pct >= 0;
        const prob= s.rise_prob || 0;
        return `<div class="ai-stock-row" onclick="location.href='/analyze'">
          <div class="rank-num">#${i+1}</div>
          <div class="stock-info">
            <div class="sname">${s.name}</div>
            <div class="scode">${s.code}</div>
          </div>
          <div class="prob-bar-wrap">
            <div class="prob-bar-bg"><div class="prob-bar" style="width:${Math.min(prob,100)}%;"></div></div>
            <div class="prob-val">${prob}%</div>
          </div>
          <div class="price-col ${up?'up':'dn'}">${s.price}</div>
          <div class="chg-col ${up?'up-bg':'dn-bg'}">${up?'+':''}${s.chg_pct}%</div>
        </div>`;
      }).join('') +
      `<div style="padding:8px 12px;text-align:center;">
        <a href="/analyze" style="font-size:.72rem;color:var(--blue);text-decoration:none;
          padding:5px 16px;border:1px solid rgba(61,139,255,.3);border-radius:6px;
          background:rgba(61,139,255,.08);display:inline-block;">
          查看完整分析結果 →
        </a>
      </div>`;
  } catch(e) { showAIEmpty('載入失敗'); }
}

function showAIEmpty(msg) {
  document.getElementById('aiStocks').innerHTML =
    `<div style="text-align:center;padding:32px;color:var(--dim);font-size:.78rem;">
      <div style="font-size:1.5rem;margin-bottom:8px;">📊</div>${msg}
      <div style="margin-top:10px;">
        <a href="/analyze" style="color:var(--blue);font-size:.72rem;">前往 AI 分析頁面</a>
      </div>
    </div>`;
}

// ── 財經新聞 ──────────────────────────────────────────
async function loadNews() {
  document.getElementById('newsList').innerHTML =
    '<div class="loading-rows" style="padding:12px;">' +
    Array(5).fill('<div class="loading-row"></div>').join('') + '</div>';
  try {
    const r = await fetch(`${API}/api/dashboard/news`);
    const d = await r.json();
    const news = d.news || [];
    if (!news.length) {
      document.getElementById('newsList').innerHTML =
        '<div style="padding:20px;text-align:center;color:var(--dim);font-size:.75rem;">無法載入新聞</div>';
      return;
    }
    document.getElementById('newsList').innerHTML = news.map((n,i) => {
      const time = n.pub ? new Date(n.pub).toLocaleTimeString('zh-TW',{hour:'2-digit',minute:'2-digit'}) : '';
      return `<a href="${n.link}" target="_blank" rel="noopener" class="news-item">
        <div class="news-num">${(i+1).toString().padStart(2,'0')}</div>
        <div class="news-title">${n.title}</div>
        ${time?`<div class="news-time">${time}</div>`:''}
      </a>`;
    }).join('');
  } catch(e) {
    document.getElementById('newsList').innerHTML =
      '<div style="padding:20px;text-align:center;color:var(--dim);font-size:.75rem;">新聞載入失敗</div>';
  }
}

// ── 初始化 ────────────────────────────────────────────
loadIndices();
loadAISummary();
loadNews();

// 每 5 分鐘刷新指數
setInterval(loadIndices, 5*60*1000);
// 每 10 分鐘刷新新聞
setInterval(loadNews, 10*60*1000);
</script>
</body>
</html>
