<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>我的追蹤清單</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lightweight-charts@4.1.1/dist/lightweight-charts.standalone.production.js"></script>
<style>
:root{
  --bg:#080b12;--bg2:#0d1120;--bg3:#121828;--bdr:#1a2235;--bdr2:#232d42;
  --red:#ef5350;--grn:#1bc47d;--gold:#f0b429;--blue:#3d8bff;--pur:#a855f7;
  --dim:#3a4560;--muted:#5a6888;--txt:#b8c4dc;--white:#e4eaf5;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--txt);font-family:'Noto Sans TC',sans-serif;min-height:100vh;}

/* ── 頂部 ── */
.topbar{
  position:sticky;top:0;z-index:100;
  background:rgba(8,11,18,.9);backdrop-filter:blur(20px);
  border-bottom:1px solid var(--bdr);
  padding:0 16px;display:flex;align-items:center;justify-content:space-between;height:52px;
}
.logo{display:flex;align-items:center;gap:8px;text-decoration:none;}
.logo-icon{width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,#1bc47d,#0d9488);
  display:flex;align-items:center;justify-content:center;font-size:.9rem;}
.logo-text{font-size:.85rem;font-weight:700;color:var(--white);}
.nav-links{display:flex;gap:4px;}
.nav-link{padding:5px 10px;border-radius:6px;font-size:.7rem;font-weight:600;
  color:var(--muted);text-decoration:none;transition:all .15s;}
.nav-link:hover{color:var(--txt);background:var(--bg3);}
.nav-link.active{color:var(--grn);background:rgba(27,196,125,.1);}
.user-chip{display:flex;align-items:center;gap:6px;font-size:.72rem;color:var(--muted);}
.user-avatar{width:26px;height:26px;border-radius:50%;
  background:linear-gradient(135deg,var(--pur),var(--blue));
  display:flex;align-items:center;justify-content:center;font-size:.7rem;font-weight:700;color:#fff;}

/* ── 登入畫面 ── */
.login-overlay{
  position:fixed;inset:0;background:rgba(8,11,18,.95);
  display:flex;align-items:center;justify-content:center;z-index:200;
}
.login-card{
  background:var(--bg2);border:1px solid var(--bdr);border-radius:16px;
  padding:32px 28px;width:320px;text-align:center;
}
.login-icon{font-size:2.5rem;margin-bottom:12px;}
.login-title{font-size:1.1rem;font-weight:700;color:var(--white);margin-bottom:6px;}
.login-sub{font-size:.75rem;color:var(--muted);margin-bottom:24px;line-height:1.5;}
.login-input{
  width:100%;padding:10px 14px;background:var(--bg3);border:1px solid var(--bdr);
  border-radius:8px;color:var(--white);font-size:.85rem;margin-bottom:10px;
  font-family:'Noto Sans TC',sans-serif;outline:none;
}
.login-input:focus{border-color:var(--blue);}
.login-btn{
  width:100%;padding:11px;background:linear-gradient(135deg,var(--blue),var(--pur));
  border:none;border-radius:8px;color:#fff;font-size:.85rem;font-weight:700;
  cursor:pointer;font-family:'Noto Sans TC',sans-serif;transition:all .15s;
}
.login-btn:hover{opacity:.9;}
.login-err{font-size:.72rem;color:var(--red);margin-top:8px;min-height:20px;}

/* ── 統計列 ── */
.stats-grid{
  display:grid;grid-template-columns:repeat(4,1fr);gap:8px;
  padding:14px 16px;max-width:900px;margin:0 auto;
}
.stat-card{background:var(--bg2);border:1px solid var(--bdr);border-radius:10px;
  padding:10px 12px;text-align:center;}
.stat-num{font-size:1.1rem;font-weight:700;font-family:'JetBrains Mono',monospace;}
.stat-lbl{font-size:.62rem;color:var(--muted);margin-top:2px;}

/* ── 工具列 ── */
.toolbar{
  padding:0 16px 12px;max-width:900px;margin:0 auto;
  display:flex;gap:8px;align-items:center;flex-wrap:wrap;
}
.search-box{
  flex:1;min-width:180px;padding:8px 12px;background:var(--bg2);
  border:1px solid var(--bdr);border-radius:8px;color:var(--white);
  font-size:.78rem;outline:none;font-family:'Noto Sans TC',sans-serif;
}
.search-box:focus{border-color:var(--blue);}
.sort-btn{
  padding:6px 12px;background:var(--bg2);border:1px solid var(--bdr);
  border-radius:7px;color:var(--muted);font-size:.7rem;cursor:pointer;
  font-family:'Noto Sans TC',sans-serif;transition:all .15s;white-space:nowrap;
}
.sort-btn.active{background:rgba(61,139,255,.12);color:var(--blue);border-color:rgba(61,139,255,.3);}

/* ── 主體 ── */
.container{max-width:900px;margin:0 auto;padding:0 16px 40px;}

/* ── 個股卡片 ── */
.stock-card{
  background:var(--bg2);border:1px solid var(--bdr);border-radius:12px;
  margin-bottom:8px;overflow:hidden;transition:border-color .15s;
}
.stock-card.expanded{border-color:var(--bdr2);}
.card-header{
  display:grid;grid-template-columns:1fr auto;align-items:center;
  padding:12px 14px;cursor:pointer;gap:10px;
}
.card-header:hover{background:rgba(255,255,255,.02);}
.stock-left{display:flex;align-items:center;gap:10px;}
.sector-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.stock-name{font-size:.88rem;font-weight:700;color:var(--white);}
.stock-meta{font-size:.65rem;color:var(--muted);margin-top:2px;}
.stock-right{display:flex;align-items:center;gap:12px;}
.price-now{font-size:.95rem;font-weight:700;font-family:'JetBrains Mono',monospace;}
.price-chg{font-size:.7rem;padding:2px 6px;border-radius:4px;font-weight:700;
  font-family:'JetBrains Mono',monospace;}
.up{color:var(--red);}
.dn{color:var(--grn);}
.up-bg{background:rgba(239,83,80,.1);color:var(--red);}
.dn-bg{background:rgba(27,196,125,.1);color:var(--grn);}
.return-badge{
  font-size:.68rem;font-weight:700;font-family:'JetBrains Mono',monospace;
  padding:3px 7px;border-radius:5px;
}
.expand-icon{font-size:.7rem;color:var(--dim);transition:transform .2s;}
.expanded .expand-icon{transform:rotate(180deg);}

/* 買進資訊列 */
.buy-info{
  display:flex;gap:16px;padding:0 14px 10px;flex-wrap:wrap;
}
.bi-item{font-size:.68rem;color:var(--muted);}
.bi-val{color:var(--txt);font-weight:600;font-family:'JetBrains Mono',monospace;}

/* 展開區塊 */
.card-detail{display:none;border-top:1px solid var(--bdr);padding:14px;}
.stock-card.expanded .card-detail{display:block;}

/* Tab */
.detail-tabs{display:flex;gap:4px;margin-bottom:12px;}
.dtab{padding:5px 12px;border-radius:6px;font-size:.72rem;font-weight:600;
  cursor:pointer;background:var(--bg3);color:var(--muted);border:1px solid var(--bdr);
  transition:all .15s;}
.dtab.active{background:rgba(61,139,255,.12);color:var(--blue);border-color:rgba(61,139,255,.3);}

/* 線圖 */
.chart-wrap{background:var(--bg);border-radius:8px;overflow:hidden;margin-bottom:8px;}
.chart-toolbar{display:flex;gap:4px;padding:8px 10px 4px;flex-wrap:wrap;}
.period-btn{padding:3px 9px;border-radius:5px;font-size:.65rem;font-weight:700;
  cursor:pointer;background:var(--bg3);color:var(--muted);border:1px solid var(--bdr);}
.period-btn.active{background:rgba(61,139,255,.15);color:var(--blue);border-color:rgba(61,139,255,.3);}

/* 指標格 */
.ind-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px;}
.ind-box{background:var(--bg3);border-radius:7px;padding:7px 9px;}
.ind-lbl{font-size:.58rem;color:var(--dim);margin-bottom:2px;}
.ind-val{font-size:.78rem;font-weight:700;font-family:'JetBrains Mono',monospace;}

/* 股價歷史 */
.history-list{display:flex;flex-direction:column;gap:4px;}
.history-row{
  display:grid;grid-template-columns:80px 1fr 70px 70px;
  gap:8px;align-items:center;padding:6px 8px;background:var(--bg3);
  border-radius:6px;font-size:.72rem;
}
.history-row.header{background:transparent;color:var(--muted);font-size:.65rem;}

/* 移除按鈕 */
.remove-btn{
  padding:5px 10px;background:rgba(239,83,80,.1);border:1px solid rgba(239,83,80,.2);
  border-radius:6px;color:var(--red);font-size:.68rem;cursor:pointer;
  transition:all .15s;margin-top:8px;
}
.remove-btn:hover{background:rgba(239,83,80,.2);}

/* 空狀態 */
.empty{text-align:center;padding:48px;color:var(--muted);}
.empty-icon{font-size:2.5rem;margin-bottom:10px;}

/* Toast */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(60px);
  background:#1e2538;border:1px solid var(--bdr);border-radius:10px;
  padding:10px 20px;font-size:.75rem;color:var(--txt);transition:transform .25s;
  z-index:999;white-space:nowrap;}
.toast.show{transform:translateX(-50%) translateY(0);}

@media(max-width:600px){
  .stats-grid{grid-template-columns:repeat(2,1fr);}
  .ind-grid{grid-template-columns:repeat(2,1fr);}
  .stock-right{gap:8px;}
}
</style>
</head>
<body>

<!-- 登入畫面 -->
<!-- 頂部 -->
<div class="topbar">
  <a href="/" class="logo">
    <div class="logo-icon">👁️</div>
    <span class="logo-text">追蹤清單</span>
  </a>
  <nav class="nav-links">
    <a href="/" class="nav-link">🏠 儀表板</a>
    <a href="/analyze" class="nav-link">🤖 AI分析</a>
    <a href="/backtest" class="nav-link">📈 回測</a>
    <a href="/watchlist" class="nav-link active">👁️ 追蹤</a>
    <a href="/factor-lab" class="nav-link">🧪 因子實驗室</a>
  </nav>
  <div class="user-chip">
    <div class="user-avatar" id="userAvatar" style="width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,#a855f7,#7c3aed);display:flex;align-items:center;justify-content:center;font-size:.72rem;font-weight:700;color:#fff;">J</div>
  </div>
</div>

<!-- 分頁切換：追蹤清單 / 交易日誌 -->
<div class="main-tabs" style="display:flex;gap:8px;padding:0 4px 14px;">
  <button class="mtab active" id="mtab_watch" onclick="switchMainTab('watch')"
    style="flex:1;padding:11px;border-radius:10px;border:1px solid var(--bdr);background:var(--pur);color:#fff;font-size:.85rem;font-weight:700;cursor:pointer;transition:all .15s;">👁️ 追蹤清單</button>
  <button class="mtab" id="mtab_journal" onclick="switchMainTab('journal')"
    style="flex:1;padding:11px;border-radius:10px;border:1px solid var(--bdr);background:var(--bg2);color:var(--muted);font-size:.85rem;font-weight:700;cursor:pointer;transition:all .15s;">📊 交易日誌</button>
</div>

<!-- 統計 -->
<div class="stats-grid">
  <div class="stat-card">
    <div class="stat-num" id="statTotal" style="color:var(--grn);">0</div>
    <div class="stat-lbl">追蹤中</div>
  </div>
  <div class="stat-card">
    <div class="stat-num" id="statUp" style="color:var(--red);">0</div>
    <div class="stat-lbl">今日上漲</div>
  </div>
  <div class="stat-card">
    <div class="stat-num" id="statDn" style="color:var(--grn);">0</div>
    <div class="stat-lbl">今日下跌</div>
  </div>
  <div class="stat-card">
    <div class="stat-num" id="statAvgRet" style="color:var(--gold);">—</div>
    <div class="stat-lbl">平均報酬</div>
  </div>
</div>

<!-- 工具列 -->
<div class="toolbar">
  <input class="search-box" id="searchBox" placeholder="搜尋代號或名稱..." oninput="renderList()">
  <button class="sort-btn active" id="sortTime" onclick="setSort('time')">⏱ 加入時間</button>
  <button class="sort-btn" id="sortCode" onclick="setSort('code')"># 代號</button>
  <button class="sort-btn" id="sortRet" onclick="setSort('ret')">📈 報酬率</button>
</div>
<button onclick="openAddWatch()" style="width:100%;padding:11px;border-radius:10px;border:1px dashed var(--grn);background:rgba(27,196,125,.08);color:var(--grn);font-size:.85rem;font-weight:600;cursor:pointer;margin-bottom:14px;">＋ 手動新增追蹤股票</button>

<!-- 清單 -->
<div class="container">
  <div id="stockList"></div>
</div>

<!-- ═══ 交易日誌區塊（預設隱藏）═══ -->
<div id="journalView" style="display:none;">
  <!-- 績效總覽 -->
  <div class="stats-grid">
    <div class="stat-card">
      <div class="stat-num" id="jTotalPnl" style="color:var(--grn);">—</div>
      <div class="stat-lbl">總損益(元)</div>
    </div>
    <div class="stat-card">
      <div class="stat-num" id="jWinRate" style="color:var(--gold);">—</div>
      <div class="stat-lbl">勝率</div>
    </div>
    <div class="stat-card">
      <div class="stat-num" id="jHolding" style="color:var(--blue);">0</div>
      <div class="stat-lbl">持倉中</div>
    </div>
    <div class="stat-card">
      <div class="stat-num" id="jClosed" style="color:var(--muted);">0</div>
      <div class="stat-lbl">已平倉</div>
    </div>
  </div>

  <!-- 來源績效對比（優化AI選股的關鍵）-->
  <div id="jSourceCompare" style="background:linear-gradient(135deg,rgba(168,85,247,.06),rgba(124,58,237,.03));border:1px solid rgba(168,85,247,.2);border-radius:12px;padding:14px;margin-bottom:14px;">
    <div style="font-size:.82rem;font-weight:700;color:#c4a4f7;margin-bottom:10px;">🎯 來源績效對比 <span style="font-size:.66rem;color:var(--muted);font-weight:400;">— 看跟AI買的有沒有比自選賺</span></div>
    <div id="jSourceRows"></div>
  </div>

  <!-- 新增交易按鈕 -->
  <button onclick="openTradeForm()" style="width:100%;padding:12px;border-radius:10px;border:1px dashed var(--pur);background:rgba(168,85,247,.08);color:#c4a4f7;font-size:.85rem;font-weight:600;cursor:pointer;margin-bottom:14px;">＋ 新增交易紀錄</button>

  <!-- 交易列表 -->
  <div id="journalList"></div>
</div>

<!-- 新增/賣出交易的彈窗 -->
<div id="tradeModal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:1000;align-items:center;justify-content:center;padding:16px;" onclick="if(event.target===this)closeTradeForm()">
  <div style="background:var(--bg2);border:1px solid var(--bdr2);border-radius:16px;padding:20px;width:100%;max-width:380px;max-height:85vh;overflow-y:auto;">
    <div id="tradeModalBody"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const API = location.hostname==='localhost' ? 'http://localhost:5000' : '';
const JACK_TOKEN = 'default';

let _cache = [];
let _prices = {};
let _sort = 'time';
let _chartInst = {};
let _chartPeriod = {};

// ── 登入 ────────────────────────────────────────────
function checkAuth() {
  showApp();  // 已移除登入，直接進入
}

function showApp() {
  loadWatchlist();  // 已移除登入，直接載入
}

// ── 讀取追蹤清單 ─────────────────────────────────────
async function loadWatchlist() {
  try {
    const r = await fetch(`${API}/api/watchlist?token=${JACK_TOKEN}`);
    const d = await r.json();
    _cache = d.stocks || [];
    renderList();
    if (_cache.length) {
      const codes = [...new Set(_cache.map(s => s.code))];
      await fetchPrices(codes);
      backfillNames();
    }
  } catch(e) {
    document.getElementById('stockList').innerHTML =
      `<div class="empty"><div class="empty-icon">⚠️</div><div>載入失敗，請重試</div></div>`;
  }
}

// ── 抓即時股價（用 TWSE）────────────────────────────
async function backfillNames() {
  const need = _cache.filter(s => !s.name || s.name === s.code);
  if (!need.length) return;
  let changed = false;
  for (const s of need) {
    try {
      const r = await fetch(`${API}/api/stock/name/${s.code}`);
      const d = await r.json();
      if (d.found && d.name) { s.name = d.name; changed = true; }
    } catch(e) {}
  }
  if (changed) renderList();
}

async function fetchPrices(codes) {
  // ① 優先：透過 server /api/prices（server 抓 TWSE+TPEX，無 CORS，最可靠）
  try {
    const codeStr = (codes||[]).join(',');
    const sr = await fetch(`${API}/api/prices?codes=${codeStr}`);
    const sd = await sr.json();
    if (sd.prices && Object.keys(sd.prices).length > 0) {
      Object.entries(sd.prices).forEach(([code, p]) => {
        _prices[code] = {price: p.price, chg: p.change, pct: p.chgPct};
      });
    }
  } catch(e) { console.log('server /api/prices 失敗，改直連', e); }

  // ② 備援：server 完全沒回，才從瀏覽器直連
  if (Object.keys(_prices).length === 0) {
    try {
      const r = await fetch('https://openapi.twse.com.tw/v1/exchangeReport/STOCK_DAY_ALL');
      const rows = await r.json();
      if (Array.isArray(rows)) rows.forEach(row => {
        const code  = row.Code || row.code;
        const price = parseFloat((row.ClosingPrice||'0').replace(',',''));
        const chg   = parseFloat((row.Change||'0').replace('+','').replace(',',''));
        const prev  = price - chg;
        const pct   = prev > 0 ? Math.round(chg/prev*10000)/100 : 0;
        if (code && price > 0) _prices[code] = {price, chg, pct};
      });
    } catch(e) {}
    try {
      const r2 = await fetch('https://www.tpex.org.tw/openapi/v1/tpex_mainboard_quotes');
      const rows2 = await r2.json();
      if (Array.isArray(rows2)) rows2.forEach(row => {
        const code  = row.SecuritiesCompanyCode || row.code;
        const price = parseFloat((row.Close||row.close||'0').replace(',',''));
        const chg   = parseFloat((row.Change||'0').replace('+','').replace(',',''));
        const prev  = price - chg;
        const pct   = prev > 0 ? Math.round(chg/prev*10000)/100 : 0;
        if (code && price > 0) _prices[code] = {price, chg, pct};
      });
    } catch(e) {}
  }

  renderList();
  updateStats();
  // 若在交易日誌分頁，重繪日誌以顯示現價/損益
  if (document.getElementById('journalView') &&
      document.getElementById('journalView').style.display !== 'none') {
    if (typeof _lastJournalData !== 'undefined' && _lastJournalData) {
      renderJournalStats(_lastJournalData.stats || {}, _lastJournalData.trades || []);
      renderJournalList(_lastJournalData.trades || []);
    }
  }
}

// ── 排序 ──────────────────────────────────────────────
function setSort(s) {
  _sort = s;
  ['sortTime','sortCode','sortRet'].forEach(id => document.getElementById(id).classList.remove('active'));
  document.getElementById(`sort${s.charAt(0).toUpperCase()+s.slice(1)}`).classList.add('active');
  renderList();
}

// ── 渲染清單 ─────────────────────────────────────────
function renderList() {
  const q = (document.getElementById('searchBox').value || '').toLowerCase();
  let list = _cache.filter(s =>
    !q || s.code.includes(q) || (s.name||'').toLowerCase().includes(q)
  );

  // 排序
  if (_sort === 'code') list.sort((a,b) => a.code.localeCompare(b.code));
  else if (_sort === 'ret') {
    list.sort((a,b) => {
      const ra = getReturn(a); const rb = getReturn(b);
      return rb - ra;
    });
  } else {
    list.sort((a,b) => new Date(b.add_time||0) - new Date(a.add_time||0));
  }

  if (!list.length) {
    document.getElementById('stockList').innerHTML =
      `<div class="empty"><div class="empty-icon">👁️</div>
       <div style="font-size:.82rem;line-height:1.6;">追蹤清單是空的<br>
       <span style="font-size:.7rem;color:var(--dim);">從 AI 分析或遊牧民選股加入個股</span></div></div>`;
    return;
  }

  document.getElementById('stockList').innerHTML = list.map(s => renderCard(s)).join('');
}

function getReturn(s) {
  const p = _prices[s.code];
  if (!p || !s.add_price) return 0;
  return Math.round((p.price - s.add_price) / s.add_price * 10000) / 100;
}

function renderCard(s) {
  const p      = _prices[s.code];
  const price  = p ? p.price : null;
  const pct    = p ? p.pct   : null;
  const ret    = (price && s.add_price) ? getReturn(s) : null;
  const retCol = ret === null ? 'var(--muted)' : ret >= 0 ? 'var(--red)' : 'var(--grn)';
  const up     = pct >= 0;

  const color  = sectorColor(s.sector || '');
  const addDate= (s.add_time||'').slice(0,10);

  return `<div class="stock-card" id="card_${s.code}">
    <div class="card-header" onclick="toggleCard('${s.code}')">
      <div class="stock-left">
        <div class="sector-dot" style="background:${color};"></div>
        <div>

// ── 展開/收合 ─────────────────────────────────────────
function toggleCard(code) {
  const card = document.getElementById('card_'+code);
  const isExp = card.classList.contains('expanded');
  card.classList.toggle('expanded');
  if (!isExp) {
    // 展開時載入線圖
    setTimeout(() => loadChart(code, '3M'), 50);
  }
}

function switchTab(code, tab) {
  ['chart','hist'].forEach(t => {
    document.getElementById(`tab_${t}_${code}`).classList.toggle('active', t===tab);
  });
  const wrap = document.getElementById('chartWrap_'+code);
  if (tab === 'chart') {
    wrap.style.display = 'block';
    loadChart(code, _chartPeriod[code]||'3M');
  } else {
    wrap.style.display = 'none';
    loadHistory(code);
  }
}

// ── 技術線圖 ──────────────────────────────────────────
async function loadChart(code, period, btn) {
  _chartPeriod[code] = period;
  if (btn) {
    const wrap = document.getElementById('chartWrap_'+code);
    wrap.querySelectorAll('.period-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
  }

  const days = {'1M':35,'3M':100,'6M':185,'1Y':370,'3Y':1095}[period]||100;
  const start = new Date(); start.setDate(start.getDate()-days);
  const startStr = start.toISOString().slice(0,10);
  const today    = new Date().toISOString().slice(0,10);

  const klineEl = document.getElementById('klineChart_'+code);
  klineEl.innerHTML = '<div style="display:flex;align-items:center;justify-content:center;height:100%;color:var(--muted);font-size:.75rem;">⏳ 載入中...</div>';

  try {
    const r = await fetch(`${API}/api/stock/history?code=${code}&start=${startStr}&end=${today}`);
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    const d = await r.json();
    const records = d.records || [];
    if (!records.length) {
      klineEl.innerHTML = '<div style="display:flex;align-items:center;justify-content:center;height:100%;color:var(--muted);font-size:.75rem;">無歷史資料（資料需在交易日後更新）</div>';
      return;
    }
    klineEl.innerHTML = '';
    drawKlineChart(code, records);
    drawKDChart(code, records);
    drawMACDChart(code, records);
    updateIndicators(code, records);
  } catch(e) {
    klineEl.innerHTML = `<div style="display:flex;align-items:center;justify-content:center;height:100%;color:var(--muted);font-size:.75rem;">線圖載入失敗: ${e.message}</div>`;
  }
}

function toTs(dateStr) {
  return Math.floor(new Date(dateStr).getTime()/1000);
}

function drawKlineChart(code, records) {
  const el = document.getElementById('klineChart_'+code);
  if (_chartInst[`k_${code}`]) { try{ _chartInst[`k_${code}`].remove(); }catch(e){} }

  const chart = LightweightCharts.createChart(el, {
    layout:{background:{color:'#080b12'},textColor:'#5a6888'},
    grid:{vertLines:{color:'#1a2235'},horzLines:{color:'#1a2235'}},
    crosshair:{mode:LightweightCharts.CrosshairMode.Normal},
    rightPriceScale:{borderColor:'#1a2235'},
    timeScale:{borderColor:'#1a2235',timeVisible:true},
    handleScroll:false,handleScale:false,
  });
  _chartInst[`k_${code}`] = chart;

  // K線
  const cs = chart.addCandlestickSeries({
    upColor:'#ef5350',downColor:'#1bc47d',
    borderUpColor:'#ef5350',borderDownColor:'#1bc47d',
    wickUpColor:'#ef5350',wickDownColor:'#1bc47d',
  });
  cs.setData(records.map(r=>({time:r.date,open:r.open||r.close,high:r.high||r.close,low:r.low||r.close,close:r.close})));

  // MA5
  const ma5s = chart.addLineSeries({color:'#f0b429',lineWidth:1,priceLineVisible:false});
  const ma5data = records.map((r,i,a)=>({time:r.date,value:i>=4?a.slice(i-4,i+1).reduce((s,x)=>s+x.close,0)/5:r.close}));
  ma5s.setData(ma5data);

  // MA20
  const ma20s = chart.addLineSeries({color:'#a855f7',lineWidth:1,priceLineVisible:false});
  const ma20d = records.map((r,i,a)=>({time:r.date,value:i>=19?a.slice(i-19,i+1).reduce((s,x)=>s+x.close,0)/20:r.close}));
  ma20s.setData(ma20d);

  // 買進線
  const stock = _cache.find(s=>s.code===code);
  if (stock?.add_price) {
    const priceLine = cs.createPriceLine({price:stock.add_price,color:'#3d8bff',lineWidth:1,lineStyle:2,axisLabelVisible:true,title:'買進'});
  }

  chart.timeScale().fitContent();
}

function drawKDChart(code, records) {
  const el = document.getElementById('kdChart_'+code);
  if (_chartInst[`kd_${code}`]) { try{ _chartInst[`kd_${code}`].remove(); }catch(e){} }

  const chart = LightweightCharts.createChart(el, {
    layout:{background:{color:'#080b12'},textColor:'#5a6888'},
    grid:{vertLines:{color:'#1a2235'},horzLines:{color:'#1a2235'}},
    rightPriceScale:{borderColor:'#1a2235'},
    timeScale:{borderColor:'#1a2235',visible:false},
    handleScroll:false,handleScale:false,
  });
  _chartInst[`kd_${code}`] = chart;

  const n = records.length;
  let k=50,d=50;
  const ks=[],ds=[];
  records.forEach((r,i)=>{
    const sl = records.slice(Math.max(0,i-8),i+1);
    const rh=Math.max(...sl.map(x=>x.high||x.close));
    const rl=Math.min(...sl.map(x=>x.low||x.close));
    const rsv = rh===rl?50:(r.close-rl)/(rh-rl)*100;
    k=k*2/3+rsv/3; d=d*2/3+k/3;
    ks.push({time:r.date,value:Math.round(k*10)/10});
    ds.push({time:r.date,value:Math.round(d*10)/10});
  });
  chart.addLineSeries({color:'#f0b429',lineWidth:1,priceLineVisible:false}).setData(ks);
  chart.addLineSeries({color:'#3d8bff',lineWidth:1,priceLineVisible:false}).setData(ds);
  chart.timeScale().fitContent();
}

function drawMACDChart(code, records) {
  const el = document.getElementById('macdChart_'+code);
  if (_chartInst[`macd_${code}`]) { try{ _chartInst[`macd_${code}`].remove(); }catch(e){} }

  const chart = LightweightCharts.createChart(el, {
    layout:{background:{color:'#080b12'},textColor:'#5a6888'},
    grid:{vertLines:{color:'#1a2235'},horzLines:{color:'#1a2235'}},
    rightPriceScale:{borderColor:'#1a2235'},
    timeScale:{borderColor:'#1a2235'},
    handleScroll:false,handleScale:false,
  });
  _chartInst[`macd_${code}`] = chart;

  const closes = records.map(r=>r.close);
  const ema = (arr,p) => {
    const k=2/(p+1); let e=arr[0]; return arr.map(x=>{e=x*k+e*(1-k);return e;});
  };
  const e12=ema(closes,12),e26=ema(closes,26);
  const macd=closes.map((_,i)=>e12[i]-e26[i]);
  const sig=ema(macd,9);
  const hist=macd.map((m,i)=>m-sig[i]);

  const histSeries = chart.addHistogramSeries({priceLineVisible:false});
  histSeries.setData(records.map((r,i)=>({
    time:r.date,value:Math.round(hist[i]*1000)/1000,
    color:hist[i]>=0?'rgba(239,83,80,.7)':'rgba(27,196,125,.7)'
  })));
  chart.addLineSeries({color:'#f0b429',lineWidth:1,priceLineVisible:false})
    .setData(records.map((r,i)=>({time:r.date,value:Math.round(macd[i]*1000)/1000})));
  chart.addLineSeries({color:'#a855f7',lineWidth:1,priceLineVisible:false})
    .setData(records.map((r,i)=>({time:r.date,value:Math.round(sig[i]*1000)/1000})));
  chart.timeScale().fitContent();
}

function updateIndicators(code, records) {
  if (!records.length) return;
  const n = records.length;
  const closes = records.map(r=>r.close);

  const ma5  = closes.slice(n-5).reduce((a,b)=>a+b,0)/5;
  const ma20 = n>=20 ? closes.slice(n-20).reduce((a,b)=>a+b,0)/20 : null;

  // KD
  let k=50,d=50;
  records.forEach((r,i)=>{
    const sl=records.slice(Math.max(0,i-8),i+1);
    const rh=Math.max(...sl.map(x=>x.high||x.close));
    const rl=Math.min(...sl.map(x=>x.low||x.close));
    const rsv=rh===rl?50:(r.close-rl)/(rh-rl)*100;
    k=k*2/3+rsv/3; d=d*2/3+k/3;
  });

  // MACD
  const ema=(arr,p)=>{const k=2/(p+1);let e=arr[0];return arr.map(x=>{e=x*k+e*(1-k);return e;});};
  const e12=ema(closes,12),e26=ema(closes,26);
  const macd=closes.map((_,i)=>e12[i]-e26[i]);
  const sig=ema(macd,9);
  const histLast=macd[n-1]-sig[n-1];

  document.getElementById(`ind_ma5_${code}`).textContent = Math.round(ma5*10)/10;
  document.getElementById(`ind_ma20_${code}`).textContent = ma20 ? Math.round(ma20*10)/10 : '—';
  const kdEl = document.getElementById(`ind_kd_${code}`);
  kdEl.textContent = `${Math.round(k*10)/10}/${Math.round(d*10)/10}`;
  kdEl.style.color = k>d ? 'var(--red)' : 'var(--grn)';
  const macdEl = document.getElementById(`ind_macd_${code}`);
  macdEl.textContent = `${histLast>=0?'+':''}${Math.round(histLast*1000)/1000}`;
  macdEl.style.color = histLast>=0 ? 'var(--red)' : 'var(--grn)';
}

// ── 追蹤記錄 ──────────────────────────────────────────
async function loadHistory(code) {
  const stock = _cache.find(s=>s.code===code);
  if (!stock) return;
  const el = document.getElementById('tabContent_'+code);

  const addDate = (stock.add_time||'').slice(0,10);
  const today   = new Date().toISOString().slice(0,10);
  // 抓取起始日：加入日往前推90天，確保有足夠K線資料（避免剛加入的股票資料太少而失敗）
  let fetchStart = addDate;
  try {
    const d90 = new Date();
    d90.setDate(d90.getDate() - 90);
    const d90str = d90.toISOString().slice(0,10);
    // 用「加入日」與「90天前」較早者當起始，確保資料量足夠
    fetchStart = (!addDate || addDate > d90str) ? d90str : addDate;
  } catch(e) { fetchStart = addDate; }
  const curPrice= _prices[code]?.price || null;
  const ret     = curPrice && stock.add_price ? Math.round((curPrice-stock.add_price)/stock.add_price*10000)/100 : null;

  try {
    const r = await fetch(`${API}/api/stock/history?code=${code}&start=${fetchStart}&end=${today}`);
    const d = await r.json();
    const allRecords = d.records || [];
    const records = allRecords.slice(-30).reverse(); // 最近30筆
    // 現價備援：即時價抓不到時，用歷史最後一筆收盤價
    const lastClose = allRecords.length ? allRecords[allRecords.length-1].close : null;
    const effPrice = curPrice || lastClose;
    const effRet = effPrice && stock.add_price ? Math.round((effPrice-stock.add_price)/stock.add_price*10000)/100 : null;

    el.innerHTML = `
      <div style="margin-bottom:10px;padding:10px;background:var(--bg3);border-radius:8px;">
        <div style="font-size:.72rem;color:var(--muted);margin-bottom:6px;">追蹤摘要</div>
        <div style="display:flex;gap:16px;flex-wrap:wrap;">
          <div style="font-size:.75rem;">加入日期 <span style="color:var(--txt);font-family:'JetBrains Mono',monospace;">${addDate}</span></div>
          <div style="font-size:.75rem;">買進價 <span style="color:var(--gold);font-family:'JetBrains Mono',monospace;">${stock.add_price||'—'}</span></div>
          <div style="font-size:.75rem;">現價 <span style="color:${effRet>=0?'var(--red)':'var(--grn)'};font-family:'JetBrains Mono',monospace;">${effPrice||'—'}</span></div>
          <div style="font-size:.75rem;">報酬率 <span style="color:${effRet>=0?'var(--red)':'var(--grn)'};font-family:'JetBrains Mono',monospace;">${effRet!==null?(effRet>=0?'+':'')+effRet+'%':'—'}</span></div>
        </div>
      </div>
      <div class="history-list">
        <div class="history-row header">
          <div>日期</div><div>收盤價</div><div>漲跌</div><div>vs買進</div>
        </div>
        ${records.map(r => {
          const chg = r.chg||0;
          const vsAdd = stock.add_price ? Math.round((r.close-stock.add_price)/stock.add_price*10000)/100 : null;
          return `<div class="history-row">
            <div style="font-family:'JetBrains Mono',monospace;font-size:.68rem;">${r.date}</div>
            <div style="font-family:'JetBrains Mono',monospace;font-weight:600;">${r.close}</div>
            <div style="color:${chg>=0?'var(--red)':'var(--grn)'};font-family:'JetBrains Mono',monospace;">${chg>=0?'+':''}${Math.round(chg*100)/100}</div>
            <div style="color:${vsAdd>=0?'var(--red)':'var(--grn)'};font-family:'JetBrains Mono',monospace;">${vsAdd!==null?(vsAdd>=0?'+':'')+vsAdd+'%':'—'}</div>
          </div>`;
        }).join('')}
      </div>`;
  } catch(e) {
    el.innerHTML = `<div style="text-align:center;padding:16px;color:var(--muted);font-size:.75rem;">
      <div style="margin-bottom:8px;">⚠️ 記錄載入失敗</div>
      <button onclick="loadHistory('${code}')"
        style="padding:6px 14px;border-radius:8px;border:1px solid var(--border);
               background:var(--bg3);color:var(--txt);font-size:.72rem;cursor:pointer;">
        🔄 重新載入
      </button>
    </div>`;
  }
}

// ── 移除追蹤 ─────────────────────────────────────────
async function removeStock(code, name) {
  if (!confirm(`確定取消追蹤 ${name}？`)) return;
  try {
    const r = await fetch(`${API}/api/watchlist/${code}?token=${JACK_TOKEN}`, {
      method:'DELETE', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({user_token: JACK_TOKEN})
    });
    const d = await r.json();
    if (d.ok) {
      _cache = _cache.filter(s => s.code !== code);
      renderList(); updateStats();
      showToast(`✓ 已取消追蹤 ${name}`);
    }
  } catch(e) { showToast('移除失敗'); }
}

// ── 統計更新 ─────────────────────────────────────────
function updateStats() {
  document.getElementById('statTotal').textContent = _cache.length;
  const withPrice = _cache.filter(s => _prices[s.code]);
  const up = withPrice.filter(s => _prices[s.code].pct > 0).length;
  const dn = withPrice.filter(s => _prices[s.code].pct < 0).length;
  document.getElementById('statUp').textContent = up;
  document.getElementById('statDn').textContent = dn;
  const rets = _cache.filter(s => _prices[s.code] && s.add_price).map(s => getReturn(s));
  if (rets.length) {
    const avg = Math.round(rets.reduce((a,b)=>a+b,0)/rets.length*100)/100;
    const el = document.getElementById('statAvgRet');
    el.textContent = `${avg>=0?'+':''}${avg}%`;
    el.style.color = avg>=0?'var(--red)':'var(--grn)';
  }
}

function sectorColor(sec) {
  const map = {
    '半導體':'#3d8bff','光電':'#f0b429','電子零組件':'#a855f7',
    '電腦':'#1bc47d','通信':'#ef5350','化學':'#ff9800',
    '金融':'#00bcd4','建材':'#8bc34a','其他':'#5a6888',
  };
  for (const [k,v] of Object.entries(map)) if (sec.includes(k)) return v;
  return '#5a6888';
}

// 輸入股號自動帶出中文名稱
let _nameFillTimer = null;
async function autoFillName(code, nameFieldId) {
  code = (code||'').trim();
  nameFieldId = nameFieldId || 'wName';
  const nameEl = document.getElementById(nameFieldId);
  if (!nameEl) return;
  if (code.length < 4) return;  // 台股代號至少4碼才查
  clearTimeout(_nameFillTimer);
  _nameFillTimer = setTimeout(async () => {
    try {
      const r = await fetch(`${API}/api/stock/name/${code}`);
      const d = await r.json();
      // 只在名稱欄為空、或使用者還沒手動改過時才自動帶入
      if (d.found && (!nameEl.value || nameEl.dataset.auto === '1')) {
        nameEl.value = d.name;
        nameEl.dataset.auto = '1';
      }
    } catch(e) {}
  }, 400);
}

async function submitAddWatch() {

  if (!code) { showToast('請輸入代號'); return; }
  const body = {
    user_token: JACK_TOKEN,
    code: code,
    name: document.getElementById('wName').value.trim() || code,
    add_price: parseFloat(document.getElementById('wPrice').value) || 0,
    note: document.getElementById('wNote').value.trim(),
    add_time: new Date().toLocaleString('sv').slice(0,16).replace('-','/').replace('-','/'),
  };
  const r = await fetch(`${API}/api/watchlist`, {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  const d = await r.json();
  if (d.ok) { closeTradeForm(); showToast('✅ 已加入追蹤'); loadWatchlist(); }
  else showToast(d.error || '加入失敗');
}

// 從追蹤清單一鍵記錄買進（自動帶入來源與AI機率）
function recordBuyFromWatch(code, name, addPrice, note) {
  // 依備註判斷來源
  let source = '自選';
  if (note && note.includes('遊牧民')) source = '遊牧民';
  else if (note && note.includes('三合一')) source = '三合一';
  else if (note && (note.includes('AI') || note.includes('推薦'))) source = 'AI推薦';
  const curPrice = _prices[code]?.price || addPrice || '';
  switchMainTab('journal');
  setTimeout(() => openTradeForm({code, name, price: curPrice, source, note}), 100);
}

function showToast(msg) {
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2500);
}

// ── 初始化 ────────────────────────────────────────────
// ═══════════════════════════════════════════
// 交易日誌
// ═══════════════════════════════════════════
const SOURCES = ['AI推薦','三合一','遊牧民','自選'];

function switchMainTab(tab) {
  const isWatch = tab === 'watch';
  document.getElementById('journalView').style.display = isWatch ? 'none' : 'block';
  // 追蹤清單相關元素
  document.querySelector('.stats-grid').style.display = isWatch ? '' : 'none';
  document.querySelector('.toolbar').style.display = isWatch ? '' : 'none';
  document.querySelector('.container').style.display = isWatch ? '' : 'none';
  // tab 樣式
  const wt = document.getElementById('mtab_watch'), jt = document.getElementById('mtab_journal');
  if (isWatch) {
    wt.style.background = 'var(--pur)'; wt.style.color = '#fff';
    jt.style.background = 'var(--bg2)'; jt.style.color = 'var(--muted)';
  } else {
    jt.style.background = 'var(--pur)'; jt.style.color = '#fff';
    wt.style.background = 'var(--bg2)'; wt.style.color = 'var(--muted)';
    loadJournal();
  }
}

let _lastJournalData = null;
async function loadJournal() {
  try {
    const r = await fetch(`${API}/api/journal?token=${JACK_TOKEN}`);
    const d = await r.json();
    _lastJournalData = d;  // 存起來供 fetchPrices 抓完現價後重繪
    // 先畫一次（現價可能還沒到，顯示 —）
    renderJournalStats(d.stats || {}, d.trades || []);
    renderJournalList(d.trades || []);
    // 再抓持倉中股票現價，抓完 fetchPrices 會自動重繪日誌
    const holdingCodes = [...new Set((d.trades||[]).filter(t=>!t.sell_price).map(t=>t.code))];
    if (holdingCodes.length) { try { await fetchPrices(holdingCodes); } catch(e){} }
  } catch(e) {
    document.getElementById('journalList').innerHTML = '<div style="text-align:center;color:var(--muted);padding:20px;font-size:.8rem;">載入失敗，請重試</div>';
  }
}

function renderJournalStats(st, trades) {
  const pnl = st.total_pnl || 0;
  const pnlEl = document.getElementById('jTotalPnl');
  pnlEl.textContent = (pnl>=0?'+':'') + pnl.toLocaleString();
  pnlEl.style.color = pnl>=0 ? 'var(--red)' : 'var(--grn)';
  document.getElementById('jWinRate').textContent = (st.win_rate||0) + '%';
  document.getElementById('jClosed').textContent = st.closed || 0;

  // 計算所有持倉的未實現損益總和（券商「損益試算」）
  let unrealizedTotal = 0, hasPrice = false;
  (trades||[]).filter(t=>!t.sell_price).forEach(t => {
    const cur = _prices[t.code];
    if (cur?.price) {
      hasPrice = true;
      const qty = t.shares*1000;
      const buyAmt = t.buy_price*qty, curVal = cur.price*qty;
      const buyFee = t.buy_fee || Math.max(Math.round(buyAmt*0.001425),20);
      const sellFee = Math.max(Math.round(curVal*0.001425),20);
      const tax = Math.round(curVal*0.003);
      unrealizedTotal += Math.round(curVal - buyAmt - buyFee - sellFee - tax);
    }
  });
  const holdEl = document.getElementById('jHolding');
  if (hasPrice) {
    holdEl.textContent = (unrealizedTotal>=0?'+':'') + unrealizedTotal.toLocaleString();
    holdEl.style.color = unrealizedTotal>=0 ? 'var(--red)' : 'var(--grn)';
    const lbl = holdEl.parentElement.querySelector('.stat-lbl');
    if (lbl) lbl.textContent = `未實現損益(持倉${st.holding||0})`;
  } else {
    holdEl.textContent = st.holding || 0;
  }

  // 來源對比
  const rows = st.by_source || {};
  let html = '';
  Object.entries(rows).forEach(([src, b]) => {
    const col = b.pnl>=0 ? 'var(--red)' : 'var(--grn)';
    html += `<div style="display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--bdr);">
      <div style="font-size:.8rem;font-weight:600;color:var(--txt);">${src}</div>
      <div style="display:flex;gap:14px;align-items:center;">
        <span style="font-size:.72rem;color:var(--muted);">${b.n}筆</span>
        <span style="font-size:.72rem;color:var(--muted);">勝率${b.win_rate}%</span>
        <span style="font-size:.85rem;font-weight:700;color:${col};font-family:'JetBrains Mono',monospace;min-width:70px;text-align:right;">${b.pnl>=0?'+':''}${b.pnl.toLocaleString()}</span>
      </div>
    </div>`;
  });
  document.getElementById('jSourceRows').innerHTML = html || '<div style="font-size:.72rem;color:var(--muted);text-align:center;padding:8px;">尚無已平倉交易</div>';
}

function renderJournalList(trades) {
  if (!trades.length) {
    document.getElementById('journalList').innerHTML = '<div style="text-align:center;color:var(--muted);padding:30px;font-size:.8rem;">尚無交易紀錄<br>點上方「＋新增交易紀錄」開始</div>';
    return;
  }
  let html = '';
  trades.forEach(t => {
    const isClosed = !!t.sell_price;
    const cur = _prices[t.code];
    if (isClosed) {
      const pnl = t.net_pnl || 0;
      const col = pnl>=0 ? 'var(--red)' : 'var(--grn)';
      html += `<div style="background:var(--bg2);border:1px solid var(--bdr);border-radius:12px;padding:14px;margin-bottom:10px;">
        <div style="display:flex;justify-content:space-between;margin-bottom:8px;">
          <div><span style="font-weight:700;color:var(--white);">${t.name||t.code}</span> <span style="font-size:.7rem;color:var(--muted);">${t.code}</span>
            <span style="font-size:.62rem;padding:1px 6px;border-radius:4px;background:rgba(168,85,247,.15);color:#c4a4f7;margin-left:6px;">${t.source||'自選'}</span></div>
          <div style="font-size:1.05rem;font-weight:800;color:${col};font-family:'JetBrains Mono',monospace;">${pnl>=0?'+':''}${pnl.toLocaleString()}</div>
        </div>
        <div style="font-size:.68rem;color:var(--muted);font-family:'JetBrains Mono',monospace;">
          買 ${t.buy_price}×${t.shares}張 (${t.buy_date}) → 賣 ${t.sell_price} (${t.sell_date}) · 淨報酬 ${t.net_pct>=0?'+':''}${t.net_pct}%
        </div>
        <div style="font-size:.62rem;color:var(--dim);margin-top:4px;">手續費 ${(t.buy_fee||0)+(t.sell_fee||0)} · 證交稅 ${t.tax||0}</div>
        <button onclick="delTrade(${t.id})" style="margin-top:8px;padding:4px 10px;border-radius:6px;border:1px solid rgba(239,83,80,.3);background:none;color:var(--red);font-size:.68rem;cursor:pointer;">刪除</button>
      </div>`;
    } else {
      // 持倉中：計算未實現損益（含手續費估算）
      const curPrice = cur?.price;
      const slDist = curPrice ? Math.round((curPrice - t.stop_loss)/curPrice*10000)/100 : null;
      const nearSL = slDist !== null && slDist < 2;
      // 未實現損益：現值 - 成本 - 買手續費 - 估算賣手續費 - 估算證交稅
      let uPnl = null, uPct = null;
      if (curPrice) {
        const qty     = t.shares * 1000;
        const buyAmt  = t.buy_price * qty;
        const curVal  = curPrice * qty;
        const buyFee  = t.buy_fee || Math.max(Math.round(buyAmt*0.001425), 20);
        const sellFee = Math.max(Math.round(curVal*0.001425), 20);
        const tax     = Math.round(curVal*0.003);
        uPnl = Math.round(curVal - buyAmt - buyFee - sellFee - tax);
        uPct = Math.round(uPnl / (buyAmt + buyFee) * 10000) / 100;
      }
      const pnlCol = uPnl===null ? 'var(--muted)' : (uPnl>=0 ? 'var(--red)' : 'var(--grn)');
      html += `<div style="background:var(--bg2);border:1px solid ${nearSL?'rgba(239,83,80,.5)':'var(--bdr)'};border-radius:12px;padding:14px;margin-bottom:10px;">
        <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px;">
          <div><span style="font-weight:700;color:var(--white);">${t.name||t.code}</span> <span style="font-size:.7rem;color:var(--muted);">${t.code}</span>
            <span style="font-size:.62rem;padding:1px 6px;border-radius:4px;background:rgba(61,139,255,.15);color:var(--blue);margin-left:6px;">持倉中</span>
            <span style="font-size:.62rem;padding:1px 6px;border-radius:4px;background:rgba(168,85,247,.15);color:#c4a4f7;margin-left:4px;">${t.source||'自選'}</span></div>
          <div style="text-align:right;">
            <div style="font-size:1.05rem;font-weight:800;color:${pnlCol};font-family:'JetBrains Mono',monospace;line-height:1.1;">${uPnl===null?'—':(uPnl>=0?'+':'')+uPnl.toLocaleString()}</div>
            <div style="font-size:.7rem;color:${pnlCol};font-family:'JetBrains Mono',monospace;">${uPct===null?'':(uPct>=0?'+':'')+uPct+'%'}</div>
          </div>
        </div>
        <div style="display:flex;justify-content:space-between;font-size:.68rem;color:var(--muted);font-family:'JetBrains Mono',monospace;margin-bottom:4px;">
          <span>成本 ${t.buy_price} × ${t.shares}張</span>
          <span>現價 <span style="color:${curPrice?'var(--white)':'var(--dim)'};">${curPrice||'—'}</span></span>
        </div>
        <div style="font-size:.66rem;color:var(--muted);font-family:'JetBrains Mono',monospace;">
          買 ${t.buy_date} · 停損 <span style="color:var(--red);">${t.stop_loss}</span> (-${t.stop_loss_pct}%)${slDist!==null?` · 距停損 <span style="color:${nearSL?'var(--red)':'var(--muted)'};">${slDist}%</span>`:''}
        </div>
        ${nearSL?'<div style="font-size:.68rem;color:var(--red);margin-top:4px;">⚠️ 接近停損價，注意風險</div>':''}
        <div style="display:flex;gap:8px;margin-top:8px;">
          <button onclick="openSellForm(${t.id},'${t.code}','${(t.name||'').replace(/'/g,'')}',${t.buy_price},${t.shares})" style="flex:1;padding:6px;border-radius:6px;border:1px solid var(--grn);background:rgba(27,196,125,.1);color:var(--grn);font-size:.72rem;cursor:pointer;">賣出平倉</button>
          <button onclick="delTrade(${t.id})" style="padding:6px 12px;border-radius:6px;border:1px solid rgba(239,83,80,.3);background:none;color:var(--red);font-size:.72rem;cursor:pointer;">刪除</button>
        </div>
      </div>`;
    }
  });
  document.getElementById('journalList').innerHTML = html;
}

// 新增交易表單
function openTradeForm(prefill) {
  const p = prefill || {};
  const today = new Date().toISOString().slice(0,10);
  document.getElementById('tradeModalBody').innerHTML = `
    <div style="font-size:1rem;font-weight:700;color:var(--white);margin-bottom:14px;">＋ 新增買進紀錄</div>
    <div style="display:flex;flex-direction:column;gap:10px;">
      <div style="display:flex;gap:8px;">
        <input id="tCode" placeholder="代號" value="${p.code||''}" oninput="autoFillName(this.value,'tName')" style="flex:1;padding:9px;background:var(--bg3);border:1px solid var(--bdr);border-radius:8px;color:var(--txt);font-size:.85rem;">
        <input id="tName" placeholder="名稱" value="${p.name||''}" style="flex:2;padding:9px;background:var(--bg3);border:1px solid var(--bdr);border-radius:8px;color:var(--txt);font-size:.85rem;">
      </div>
      <div style="display:flex;gap:8px;">
        <input id="tBuyPrice" type="number" step="0.01" placeholder="買進價" value="${p.price||''}" style="flex:1;padding:9px;background:var(--bg3);border:1px solid var(--bdr);border-radius:8px;color:var(--txt);font-size:.85rem;">
        <input id="tShares" type="number" placeholder="張數" value="1" style="flex:1;padding:9px;background:var(--bg3);border:1px solid var(--bdr);border-radius:8px;color:var(--txt);font-size:.85rem;">
      </div>
      <input id="tBuyDate" type="date" value="${today}" style="padding:9px;background:var(--bg3);border:1px solid var(--bdr);border-radius:8px;color:var(--txt);font-size:.85rem;">
      <div style="display:flex;gap:8px;align-items:center;">
        <label style="font-size:.75rem;color:var(--muted);">停損幅度</label>
        <input id="tStopLoss" type="number" value="8" style="width:70px;padding:9px;background:var(--bg3);border:1px solid var(--bdr);border-radius:8px;color:var(--txt);font-size:.85rem;">
        <span style="font-size:.75rem;color:var(--muted);">%</span>
        <select id="tSource" style="flex:1;padding:9px;background:var(--bg3);border:1px solid var(--bdr);border-radius:8px;color:var(--txt);font-size:.85rem;">
          ${SOURCES.map(s=>`<option ${p.source===s?'selected':''}>${s}</option>`).join('')}
        </select>
      </div>
      <input id="tNote" placeholder="備註（選填）" value="${p.note||''}" style="padding:9px;background:var(--bg3);border:1px solid var(--bdr);border-radius:8px;color:var(--txt);font-size:.85rem;">
      <input type="hidden" id="tAiProb" value="${p.ai_rise_prob||0}">
      <div style="display:flex;gap:8px;margin-top:6px;">
        <button onclick="closeTradeForm()" style="flex:1;padding:10px;border-radius:8px;border:1px solid var(--bdr);background:none;color:var(--muted);font-size:.85rem;cursor:pointer;">取消</button>
        <button onclick="submitTrade()" style="flex:2;padding:10px;border-radius:8px;border:none;background:var(--pur);color:#fff;font-size:.85rem;font-weight:600;cursor:pointer;">確認買進</button>
      </div>
    </div>`;
  document.getElementById('tradeModal').style.display = 'flex';
}

function openSellForm(id, code, name, buyPrice, shares) {
  const today = new Date().toISOString().slice(0,10);
  const cur = _prices[code]?.price || '';
  document.getElementById('tradeModalBody').innerHTML = `
    <div style="font-size:1rem;font-weight:700;color:var(--white);margin-bottom:6px;">賣出平倉 — ${name} ${code}</div>
    <div style="font-size:.72rem;color:var(--muted);margin-bottom:14px;">買進 ${buyPrice} × ${shares}張</div>
    <div style="display:flex;flex-direction:column;gap:10px;">
      <input id="sSellPrice" type="number" step="0.01" placeholder="賣出價" value="${cur}" style="padding:9px;background:var(--bg3);border:1px solid var(--bdr);border-radius:8px;color:var(--txt);font-size:.85rem;">
      <input id="sSellDate" type="date" value="${today}" style="padding:9px;background:var(--bg3);border:1px solid var(--bdr);border-radius:8px;color:var(--txt);font-size:.85rem;">
      <div id="sPnlPreview" style="font-size:.75rem;color:var(--muted);text-align:center;padding:6px;"></div>
      <div style="display:flex;gap:8px;margin-top:6px;">
        <button onclick="closeTradeForm()" style="flex:1;padding:10px;border-radius:8px;border:1px solid var(--bdr);background:none;color:var(--muted);font-size:.85rem;cursor:pointer;">取消</button>
        <button onclick="submitSell(${id})" style="flex:2;padding:10px;border-radius:8px;border:none;background:var(--grn);color:#fff;font-size:.85rem;font-weight:600;cursor:pointer;">確認賣出</button>
      </div>
    </div>`;
  document.getElementById('tradeModal').style.display = 'flex';
}

function closeTradeForm() { document.getElementById('tradeModal').style.display = 'none'; }

async function submitTrade() {
  const body = {
    user_token: JACK_TOKEN,
    code: document.getElementById('tCode').value.trim(),
    name: document.getElementById('tName').value.trim(),
    buy_price: parseFloat(document.getElementById('tBuyPrice').value),
    shares: parseInt(document.getElementById('tShares').value)||1,
    buy_date: document.getElementById('tBuyDate').value,
    stop_loss_pct: parseFloat(document.getElementById('tStopLoss').value)||8,
    source: document.getElementById('tSource').value,
    ai_rise_prob: parseFloat(document.getElementById('tAiProb').value)||0,
    note: document.getElementById('tNote').value.trim(),
  };
  if (!body.code || !body.buy_price) { showToast('請填代號和買進價'); return; }
  const r = await fetch(`${API}/api/journal`, {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  const d = await r.json();
  if (d.ok) { closeTradeForm(); showToast('✅ 已新增交易'); loadJournal(); }
  else showToast('新增失敗');
}

async function submitSell(id) {
  const body = {
    user_token: JACK_TOKEN,
    sell_price: parseFloat(document.getElementById('sSellPrice').value),
    sell_date: document.getElementById('sSellDate').value,
  };
  if (!body.sell_price) { showToast('請填賣出價'); return; }
  const r = await fetch(`${API}/api/journal/${id}/sell`, {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  const d = await r.json();
  if (d.ok) { closeTradeForm(); showToast(`✅ 已平倉，淨損益 ${d.pnl.net_pnl>=0?'+':''}${d.pnl.net_pnl}`); loadJournal(); }
  else showToast('賣出失敗');
}

async function delTrade(id) {
  if (!confirm('確定刪除這筆交易？')) return;
  const r = await fetch(`${API}/api/journal/${id}?token=${JACK_TOKEN}`, {method:'DELETE'});
  const d = await r.json();
  if (d.ok) { showToast('已刪除'); loadJournal(); }
}

function showToast(msg) {
  const t = document.getElementById('toast');
  if (!t) { alert(msg); return; }
  t.textContent = msg; t.style.opacity = '1';
  setTimeout(()=>{ t.style.opacity = '0'; }, 2000);
}

checkAuth();
