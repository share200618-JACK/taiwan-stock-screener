<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>遊牧民選股系統</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#080b12;--bg2:#0d1120;--bg3:#121828;--bdr:#1a2235;--bdr2:#232d42;
  --red:#ef5350;--grn:#1bc47d;--gold:#f0b429;--blue:#3d8bff;--pur:#a855f7;
  --dim:#3a4560;--muted:#5a6888;--txt:#b8c4dc;--white:#e4eaf5;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--txt);font-family:'Noto Sans TC',sans-serif;}

.topbar{
  position:sticky;top:0;z-index:100;
  background:rgba(8,11,18,.9);backdrop-filter:blur(20px);
  border-bottom:1px solid var(--bdr);
  padding:0 16px;display:flex;align-items:center;justify-content:space-between;height:52px;
}
.logo{display:flex;align-items:center;gap:8px;text-decoration:none;}
.logo-icon{width:30px;height:30px;border-radius:8px;
  background:linear-gradient(135deg,#f0b429,#ef5350);
  display:flex;align-items:center;justify-content:center;font-size:.9rem;}
.logo-text{font-size:.85rem;font-weight:700;color:var(--white);}
.nav-links{display:flex;gap:4px;}
.nav-link{padding:5px 10px;border-radius:6px;font-size:.7rem;font-weight:600;
  color:var(--muted);text-decoration:none;transition:all .15s;}
.nav-link:hover{color:var(--txt);background:var(--bg3);}
.nav-link.active{color:var(--gold);background:rgba(240,180,41,.1);}
.btn-run{
  padding:7px 14px;border:none;border-radius:8px;cursor:pointer;
  font-size:.75rem;font-weight:700;font-family:'Noto Sans TC',sans-serif;
  background:linear-gradient(135deg,#f0b429,#ef5350);color:#fff;
  box-shadow:0 2px 10px rgba(240,180,41,.3);transition:all .15s;
}
.btn-run:hover{transform:translateY(-1px);box-shadow:0 4px 16px rgba(240,180,41,.4);}
.btn-run:disabled{opacity:.5;cursor:not-allowed;transform:none;}

.container{max-width:900px;margin:0 auto;padding:14px 16px 40px;}

/* 條件卡片 */
.conds-wrap{
  background:var(--bg2);border:1px solid var(--bdr);border-radius:12px;
  padding:12px 14px;margin-bottom:12px;
}
.conds-title{font-size:.7rem;color:var(--muted);margin-bottom:8px;
  text-transform:uppercase;letter-spacing:.5px;}
.conds-row{display:flex;flex-wrap:wrap;gap:6px;}
.cond-pill{
  padding:4px 10px;border-radius:6px;font-size:.68rem;font-weight:600;
  background:rgba(240,180,41,.1);color:var(--gold);
  border:1px solid rgba(240,180,41,.2);
  font-family:'JetBrains Mono',monospace;
}

/* 狀態 */
.status-bar{
  background:var(--bg2);border:1px solid var(--bdr);border-radius:10px;
  padding:10px 14px;margin-bottom:12px;
  display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;
}
.status-dot{width:7px;height:7px;border-radius:50%;background:var(--grn);
  box-shadow:0 0 6px var(--grn);animation:pulse 2s infinite;flex-shrink:0;}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.hist-pills{display:flex;gap:5px;flex-wrap:wrap;}
.hist-pill{padding:3px 9px;border:1px solid var(--bdr);border-radius:5px;
  background:var(--bg3);color:var(--muted);font-size:.65rem;cursor:pointer;transition:all .15s;}
.hist-pill.active{background:rgba(240,180,41,.12);color:var(--gold);border-color:rgba(240,180,41,.3);}

/* 進行中 */
.running-wrap{
  background:var(--bg2);border:1px solid var(--bdr);border-radius:10px;
  padding:16px;margin-bottom:12px;display:none;
}
.running-wrap.show{display:block;}
.prog-bg{background:var(--bg3);border-radius:4px;height:5px;overflow:hidden;margin:8px 0;}
.prog-bar{height:100%;width:0%;border-radius:4px;
  background:linear-gradient(90deg,#f0b429,#ef5350);
  transition:width .5s;}
.spin{animation:spin 1s linear infinite;display:inline-block;}
@keyframes spin{to{transform:rotate(360deg)}}

/* 摘要 */
.summary-row{
  display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px;
}
.sum-card{background:var(--bg2);border:1px solid var(--bdr);border-radius:10px;
  padding:10px 12px;text-align:center;}
.sum-num{font-size:1.1rem;font-weight:700;font-family:'JetBrains Mono',monospace;}
.sum-lbl{font-size:.62rem;color:var(--muted);margin-top:2px;}

/* 產業分組 */
.sector-group{margin-bottom:14px;}
.sector-header{
  display:flex;align-items:center;justify-content:space-between;
  padding:8px 12px;background:var(--bg3);border:1px solid var(--bdr);
  border-radius:8px 8px 0 0;cursor:pointer;
}
.sector-name{font-size:.78rem;font-weight:700;color:var(--white);}
.sector-meta{font-size:.65rem;color:var(--muted);}
.sector-avg{font-size:.72rem;font-weight:700;font-family:'JetBrains Mono',monospace;}
.sector-stocks{border:1px solid var(--bdr);border-top:none;border-radius:0 0 8px 8px;overflow:hidden;}

/* 個股行 */
.stock-row{
  display:grid;grid-template-columns:1fr 70px 70px 70px 36px;
  align-items:center;gap:8px;
  padding:9px 12px;border-bottom:1px solid var(--bdr);
  background:var(--bg2);transition:background .12s;
}
.stock-row:last-child{border-bottom:none;}
.stock-row:hover{background:var(--bg3);}
.sr-info .sr-name{font-size:.8rem;font-weight:600;color:var(--white);}
.sr-info .sr-code{font-size:.62rem;color:var(--muted);}
.sr-price{font-size:.82rem;font-weight:700;font-family:'JetBrains Mono',monospace;text-align:right;}
.sr-chg{font-size:.7rem;font-weight:700;font-family:'JetBrains Mono',monospace;
  text-align:right;padding:2px 5px;border-radius:4px;}
.sr-ind{font-size:.68rem;font-family:'JetBrains Mono',monospace;text-align:right;color:var(--blue);}
.up{color:var(--red);}
.dn{color:var(--grn);}
.up-bg{background:rgba(239,83,80,.1);color:var(--red);}
.dn-bg{background:rgba(27,196,125,.1);color:var(--grn);}
.remove-btn{
  width:26px;height:26px;border:1px solid var(--bdr);border-radius:5px;
  background:var(--bg3);color:var(--muted);cursor:pointer;
  font-size:.7rem;display:flex;align-items:center;justify-content:center;
  transition:all .15s;flex-shrink:0;
}
.remove-btn:hover{background:rgba(239,83,80,.15);color:var(--red);border-color:rgba(239,83,80,.3);}

/* 空狀態 */
.empty{text-align:center;padding:48px;color:var(--muted);}
.empty-icon{font-size:2.5rem;margin-bottom:10px;}

/* Toast */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(60px);
  background:#1e2538;border:1px solid var(--bdr);border-radius:10px;
  padding:10px 20px;font-size:.75rem;color:var(--txt);transition:transform .25s;
  z-index:999;white-space:nowrap;}
.toast.show{transform:translateX(-50%) translateY(0);}

@media(max-width:600px){
  .summary-row{grid-template-columns:repeat(2,1fr);}
  .stock-row{grid-template-columns:1fr 60px 55px 60px 30px;gap:5px;}
}
</style>
</head>
<body>

<div class="topbar">
  <a href="/" class="logo">
    <div class="logo-icon">🐎</div>
    <span class="logo-text">遊牧民選股</span>
  </a>
  <nav class="nav-links">
    <a href="/" class="nav-link">🏠 儀表板</a>
    <a href="/analyze" class="nav-link">🤖 AI分析</a>
    <a href="/reversal" class="nav-link">🎯 三合一</a>
    <a href="/screener" class="nav-link active">🐎 遊牧民</a>
    <a href="/watchlist" class="nav-link">👁️ 追蹤</a>
  </nav>
  <button class="btn-run" id="runBtn" onclick="triggerRun()">▶ 立即執行</button>
</div>

<div class="container">

  <!-- 選股條件 -->
  <div class="conds-wrap" style="margin-top:6px;">
    <div class="conds-title">選股條件（五個全中）</div>
    <div class="conds-row">
      <span class="cond-pill">① 近20日均量 &gt; 2000張</span>
      <span class="cond-pill">② 今日量 &gt; 近5日均量×2倍</span>
      <span class="cond-pill">③ KD黃金交叉（K&gt;D，前日K≤D）</span>
      <span class="cond-pill">④ K(9) &lt; 50</span>
      <span class="cond-pill">⑤ K(9) &gt; 20</span>
      <span class="cond-pill">⑥ 股價 &gt; MA60</span>
    </div>
  </div>

  <!-- 狀態 -->
  <div class="status-bar">
    <div style="display:flex;align-items:center;gap:8px;">
      <div class="status-dot" id="statusDot"></div>
      <div>
        <div style="font-size:.75rem;color:var(--txt);" id="statusText">載入中...</div>
        <div style="font-size:.65rem;color:var(--muted);" id="statusMeta"></div>
      </div>
    </div>
    <div class="hist-pills" id="histPills"></div>
  </div>

  <!-- 進行中 -->
  <div class="running-wrap" id="runningWrap">
    <div style="font-size:.82rem;font-weight:700;display:flex;align-items:center;gap:8px;">
      <span class="spin">⏳</span> 遊牧民選股執行中...
    </div>
    <div class="prog-bg"><div class="prog-bar" id="progBar"></div></div>
    <div style="font-size:.7rem;color:var(--muted);" id="progMsg">掃描股票清單...</div>
  </div>

  <!-- 摘要 -->
  <div class="summary-row" id="summaryRow" style="display:none;">
    <div class="sum-card">
      <div class="sum-num" id="sumScanned" style="color:var(--blue);">—</div>
      <div class="sum-lbl">掃描支數</div>
    </div>
    <div class="sum-card">
      <div class="sum-num" id="sumPassed" style="color:var(--gold);">—</div>
      <div class="sum-lbl">通過支數</div>
    </div>
    <div class="sum-card">
      <div class="sum-num" id="sumSectors" style="color:var(--pur);">—</div>
      <div class="sum-lbl">涉及產業</div>
    </div>
    <div class="sum-card">
      <div class="sum-num" id="sumTime" style="color:var(--muted);font-size:.7rem;">—</div>
      <div class="sum-lbl">執行時間</div>
    </div>
  </div>

  <!-- 結果（依產業分組） -->
  <div id="resultSection"></div>

  <!-- 空狀態 -->
  <div class="empty" id="emptyState">
    <div class="empty-icon">🐎</div>
    <div style="font-size:.82rem;line-height:1.6;">尚無分析資料<br>點「立即執行」或等待今晚 22:00<br>
      <span style="font-size:.7rem;color:var(--dim);">結果會自動加入追蹤清單</span>
    </div>
  </div>

</div>

<div class="toast" id="toast"></div>

<script>
const API = location.hostname==='localhost' ? 'http://localhost:5000' : '';
let _pollTimer=null, _isRunning=false;
let _userToken = '';

async function init() {
  // 取得 token
  if (typeof getToken === 'function') _userToken = getToken() || 'default';
  else _userToken = localStorage.getItem('tw_user_token') || 'default';

  await loadHistory();
  await loadLatest();
}

async function loadHistory() {
  try {
    const r = await fetch(`${API}/api/nomad/history`);
    const d = await r.json();
    const hist = d.history || [];
    document.getElementById('histPills').innerHTML = hist.slice(0,7).map((h,i)=>
      `<div class="hist-pill ${i===0?'active':''}" onclick="loadDate('${h.date}',this)">
        ${h.date.slice(5)} <span style="color:var(--gold);">${h.total_passed}支</span>
      </div>`
    ).join('');
  } catch(e){}
}

async function loadLatest(date) {
  try {
    const url = date ? `${API}/api/nomad/latest?date=${date}` : `${API}/api/nomad/latest`;
    const r = await fetch(url);
    if (!r.ok){showEmpty();return;}
    const d = await r.json();
    if (d.error){showEmpty();return;}
    renderResult(d);
  } catch(e){showEmpty();}
}

async function loadDate(date,el) {
  document.querySelectorAll('.hist-pill').forEach(p=>p.classList.remove('active'));
  if(el) el.classList.add('active');
  await loadLatest(date);
}

function renderResult(d) {
  const stocks = d.stocks || [];
  document.getElementById('emptyState').style.display='none';
  document.getElementById('summaryRow').style.display='grid';
  document.getElementById('sumScanned').textContent = d.total_scanned||'—';
  document.getElementById('sumPassed').textContent  = d.total_passed||'—';
  document.getElementById('sumTime').textContent    = d.time||'—';
  document.getElementById('statusText').textContent = `上次執行：${d.time||'—'}`;
  document.getElementById('statusMeta').textContent =
    `掃描 ${d.total_scanned} 支 → ${d.total_passed} 支通過`;

  if (!stocks.length) {
    document.getElementById('resultSection').innerHTML =
      `<div class="empty"><div class="empty-icon">😶</div>
       <div>今日無股票符合全部五個條件</div></div>`;
    document.getElementById('sumSectors').textContent = '0';
    return;
  }

  // 依產業分組
  const sectorMap = {};
  stocks.forEach(s => {
    const sec = s.sector || '其他';
    if (!sectorMap[sec]) sectorMap[sec] = [];
    sectorMap[sec].push(s);
  });

  // 各產業依平均漲幅排序
  const sectors = Object.entries(sectorMap)
    .map(([sec, list]) => ({
      sector: sec,
      stocks: list,
      avg_chg: list.reduce((a,b)=>a+b.chg_pct,0)/list.length,
    }))
    .sort((a,b) => b.avg_chg - a.avg_chg);

  document.getElementById('sumSectors').textContent = sectors.length;

  document.getElementById('resultSection').innerHTML = sectors.map(sg => {
    const up = sg.avg_chg >= 0;
    return `<div class="sector-group">
      <div class="sector-header">
        <div>
          <span class="sector-name">${sg.sector}</span>
          <span class="sector-meta" style="margin-left:8px;">${sg.stocks.length} 支</span>
        </div>
        <span class="sector-avg" style="color:${up?'var(--red)':'var(--grn)'};">
          平均 ${up?'+':''}${sg.avg_chg.toFixed(2)}%
        </span>
      </div>
      <div class="sector-stocks">
        ${sg.stocks.map(s => {
          const up2 = s.chg_pct >= 0;
          return `<div class="stock-row">
            <div class="sr-info">
              <div class="sr-name">${s.name}</div>
              <div class="sr-code">${s.code} · 量比${s.vol_ratio}x · K=${s.k}</div>
            </div>
            <div class="sr-price ${up2?'up':'dn'}">${s.price}</div>
            <div class="sr-chg ${up2?'up-bg':'dn-bg'}">${up2?'+':''}${s.chg_pct}%</div>
            <div class="sr-ind">MA60+${s.ma60_pct}%</div>
            <button class="remove-btn" onclick="removeFromWatch('${s.code}','${s.name}',this)"
              title="從追蹤清單移除">✕</button>
          </div>`;
        }).join('')}
      </div>
    </div>`;
  }).join('');
}

function showEmpty() {
  document.getElementById('emptyState').style.display='block';
  document.getElementById('summaryRow').style.display='none';
  document.getElementById('resultSection').innerHTML='';
  document.getElementById('statusText').textContent='尚無資料';
}

async function removeFromWatch(code, name, btn) {
  try {
    const r = await fetch(`${API}/api/watchlist/${code}?token=${_userToken}`, {
      method:'DELETE',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({user_token: _userToken})
    });
    const d = await r.json();
    if (d.ok) {
      btn.textContent='✓';
      btn.style.color='var(--grn)';
      btn.disabled=true;
      showToast(`${name} 已從追蹤清單移除`);
    }
  } catch(e) { showToast('移除失敗'); }
}

async function triggerRun() {
  if (_isRunning) return;
  _isRunning=true;
  const btn=document.getElementById('runBtn');
  btn.disabled=true; btn.textContent='執行中...';
  document.getElementById('runningWrap').classList.add('show');
  document.getElementById('progBar').style.width='3%';
  showToast('遊牧民選股已啟動，約 30~60 分鐘完成，結果自動加入追蹤清單');
  try {
    await fetch(`${API}/api/nomad/run`, {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({user_token: _userToken})
    });
    startFakePoll();
  } catch(e) {
    showToast('❌ 啟動失敗');
    resetRun();
  }
}

function startFakePoll() {
  let pct=3, mi=0;
  const msgs=['掃描股票清單...','計算均量篩選...','確認今日爆量...','計算KD黃金交叉...','確認站上MA60...','整理產業分類...','自動加入追蹤清單...'];
  _pollTimer = setInterval(async()=>{
    pct=Math.min(pct+(Math.random()*2),88);
    document.getElementById('progBar').style.width=pct+'%';
    document.getElementById('progMsg').textContent=msgs[mi%msgs.length];
    mi++;
    if (mi%12===0) {
      try {
        const r=await fetch(`${API}/api/nomad/latest`);
        const d=await r.json();
        if (!d.error) {
          const today=new Date().toISOString().slice(0,10);
          if ((d.date||'')===today) {
            clearInterval(_pollTimer);
            document.getElementById('progBar').style.width='100%';
            document.getElementById('progMsg').textContent='✅ 完成！';
            setTimeout(()=>{
              document.getElementById('runningWrap').classList.remove('show');
              resetRun(); renderResult(d); loadHistory();
              showToast(`✅ 完成！${d.total_passed} 支通過，已加入追蹤清單`);
            },800);
          }
        }
      } catch(e){}
    }
  },3000);
  setTimeout(()=>{
    clearInterval(_pollTimer);
    loadLatest(); loadHistory();
    resetRun();
    document.getElementById('runningWrap').classList.remove('show');
  },70*60*1000);
}

function resetRun() {
  _isRunning=false;
  const btn=document.getElementById('runBtn');
  btn.disabled=false; btn.textContent='▶ 立即執行';
}

function showToast(msg) {
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),3000);
}

init();
</script>
</body>
</html>
