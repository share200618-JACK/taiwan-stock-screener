<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>三合一選股系統</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#080b12;--bg2:#0d1120;--bg3:#121828;--bdr:#1a2235;--bdr2:#232d42;
  --red:#ef5350;--grn:#1bc47d;--gold:#f0b429;--blue:#3d8bff;--pur:#a855f7;
  --dim:#3a4560;--muted:#5a6888;--txt:#b8c4dc;--white:#e4eaf5;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--txt);font-family:'Noto Sans TC',sans-serif;min-height:100vh;}

.topbar{
  position:sticky;top:0;z-index:100;
  background:rgba(8,11,18,.9);backdrop-filter:blur(20px);
  border-bottom:1px solid var(--bdr);
  padding:0 16px;display:flex;align-items:center;justify-content:space-between;height:52px;
}
.logo{display:flex;align-items:center;gap:8px;text-decoration:none;}
.logo-icon{width:30px;height:30px;border-radius:8px;
  background:linear-gradient(135deg,#f0b429,#ef5350,#a855f7);
  display:flex;align-items:center;justify-content:center;font-size:.9rem;}
.logo-text{font-size:.85rem;font-weight:700;color:var(--white);}
.nav-links{display:flex;gap:4px;}
.nav-link{padding:5px 10px;border-radius:6px;font-size:.7rem;font-weight:600;
  color:var(--muted);text-decoration:none;transition:all .15s;}
.nav-link:hover{color:var(--txt);background:var(--bg3);}
.nav-link.active{color:var(--gold);background:rgba(240,180,41,.1);}
.btn-run{
  padding:7px 16px;border:none;border-radius:8px;cursor:pointer;
  font-size:.75rem;font-weight:700;font-family:'Noto Sans TC',sans-serif;
  background:linear-gradient(135deg,#f0b429,#a855f7);color:#fff;
  box-shadow:0 2px 12px rgba(168,85,247,.3);transition:all .15s;
}
.btn-run:hover{box-shadow:0 4px 20px rgba(168,85,247,.5);transform:translateY(-1px);}
.btn-run:disabled{opacity:.5;cursor:not-allowed;transform:none;}

.container{max-width:900px;margin:0 auto;padding:14px 16px 40px;}

/* 評分說明 */
.score-legend{
  display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px;
}
.score-card{
  background:var(--bg2);border:1px solid var(--bdr);border-radius:10px;
  padding:10px 12px;
}
.sc-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;}
.sc-title{font-size:.72rem;font-weight:700;}
.sc-max{font-size:.65rem;color:var(--muted);font-family:'JetBrains Mono',monospace;}
.sc-items{display:flex;flex-direction:column;gap:3px;}
.sc-item{font-size:.62rem;color:var(--muted);display:flex;justify-content:space-between;}
.sc-item span{color:var(--txt);font-family:'JetBrains Mono',monospace;}

/* 狀態列 */
.status-bar{
  background:var(--bg2);border:1px solid var(--bdr);border-radius:10px;
  padding:10px 14px;margin-bottom:12px;
  display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;
}
.status-dot{width:7px;height:7px;border-radius:50%;background:var(--grn);
  box-shadow:0 0 6px var(--grn);animation:pulse 2s infinite;flex-shrink:0;}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.hist-pills{display:flex;gap:5px;flex-wrap:wrap;}
.hist-pill{padding:3px 9px;border:1px solid var(--bdr);border-radius:5px;
  background:var(--bg3);color:var(--muted);font-size:.65rem;cursor:pointer;transition:all .15s;}
.hist-pill.active{background:rgba(240,180,41,.12);color:var(--gold);border-color:rgba(240,180,41,.3);}

/* 進行中 */
.running-wrap{
  background:var(--bg2);border:1px solid var(--bdr);border-radius:10px;
  padding:16px;margin-bottom:12px;display:none;
}
.running-wrap.show{display:block;}
.prog-bg{background:var(--bg3);border-radius:4px;height:5px;overflow:hidden;margin:8px 0;}
.prog-bar{height:100%;width:0%;border-radius:4px;
  background:linear-gradient(90deg,#f0b429,#ef5350,#a855f7);
  box-shadow:0 0 8px rgba(168,85,247,.4);transition:width .5s;}
.spin{animation:spin 1s linear infinite;display:inline-block;}
@keyframes spin{to{transform:rotate(360deg)}}

/* 個股卡片 */
.stock-list{display:flex;flex-direction:column;gap:8px;}
.stock-card{
  background:var(--bg2);border:1px solid var(--bdr);border-radius:12px;
  padding:12px 14px;cursor:pointer;transition:border-color .15s;
}
.stock-card:hover{border-color:var(--bdr2);}
.card-top{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:10px;}
.card-left .rank{font-size:.62rem;color:var(--muted);margin-bottom:2px;}
.card-left .name{font-size:.9rem;font-weight:700;color:var(--white);}
.card-left .code{font-size:.68rem;color:var(--muted);}
.card-right{text-align:right;}
.total-score{
  font-size:1.1rem;font-weight:700;font-family:'JetBrains Mono',monospace;
  background:linear-gradient(135deg,#f0b429,#a855f7);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
}
.score-label{font-size:.6rem;color:var(--muted);}
.price-row{font-size:.75rem;margin-top:3px;}

/* 三維評分條 */
.score-bars{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:8px;}
.score-bar-item{background:var(--bg3);border-radius:6px;padding:6px 8px;}
.sbi-label{font-size:.6rem;color:var(--muted);margin-bottom:3px;display:flex;justify-content:space-between;}
.sbi-label span{font-family:'JetBrains Mono',monospace;font-weight:700;}
.sbi-track{background:var(--bg);border-radius:3px;height:5px;overflow:hidden;}
.sbi-fill{height:100%;border-radius:3px;transition:width .4s;}

/* 指標徽章 */
.detail-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;}
.detail-box{background:var(--bg3);border-radius:6px;padding:5px 8px;}
.db-label{font-size:.58rem;color:var(--dim);margin-bottom:2px;}
.db-val{font-size:.72rem;font-weight:700;font-family:'JetBrains Mono',monospace;}

/* 空狀態 */
.empty{text-align:center;padding:48px;color:var(--muted);}
.empty-icon{font-size:2.5rem;margin-bottom:10px;}

/* Toast */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(60px);
  background:#1e2538;border:1px solid var(--bdr);border-radius:10px;
  padding:10px 20px;font-size:.75rem;color:var(--txt);transition:transform .25s;
  z-index:999;white-space:nowrap;}
.toast.show{transform:translateX(-50%) translateY(0);}

@media(max-width:600px){
  .score-legend{grid-template-columns:1fr;}
  .score-bars{grid-template-columns:1fr;}
  .detail-grid{grid-template-columns:repeat(2,1fr);}
}
</style>
</head>
<body>

<div class="topbar">
  <a href="/" class="logo">
    <div class="logo-icon">🎯</div>
    <span class="logo-text">三合一選股</span>
  </a>
  <nav class="nav-links">
    <a href="/" class="nav-link">🏠 儀表板</a>
    <a href="/analyze" class="nav-link">🤖 AI分析</a>
    <a href="/reversal" class="nav-link active">🎯 三合一</a>
    <a href="/watchlist" class="nav-link">👁️ 追蹤</a>
  </nav>
  <button class="btn-run" id="runBtn" onclick="triggerRun()">▶ 立即執行</button>
</div>

<div class="container">

  <!-- 評分說明 -->
  <div class="score-legend" style="margin-top:6px;">
    <div class="score-card">
      <div class="sc-header">
        <div class="sc-title" style="color:#f0b429;">📊 基本面</div>
        <div class="sc-max">50分</div>
      </div>
      <div class="sc-items">
        <div class="sc-item">月營收年增率<span>10分</span></div>
        <div class="sc-item">EPS 年增率<span>10分</span></div>
        <div class="sc-item">毛利率水準<span>10分</span></div>
        <div class="sc-item">現金殖利率<span>10分</span></div>
        <div class="sc-item">本益比合理<span>10分</span></div>
      </div>
    </div>
    <div class="score-card">
      <div class="sc-header">
        <div class="sc-title" style="color:#3d8bff;">📈 技術面</div>
        <div class="sc-max">30分</div>
      </div>
      <div class="sc-items">
        <div class="sc-item">站上 MA20<span>10分</span></div>
        <div class="sc-item">KD 黃金交叉<span>10分</span></div>
        <div class="sc-item">MACD 翻正<span>10分</span></div>
      </div>
    </div>
    <div class="score-card">
      <div class="sc-header">
        <div class="sc-title" style="color:#a855f7;">🏦 籌碼面</div>
        <div class="sc-max">20分</div>
      </div>
      <div class="sc-items">
        <div class="sc-item">法人連續買超<span>10分</span></div>
        <div class="sc-item">量能健康放大<span>10分</span></div>
      </div>
      <div style="font-size:.58rem;color:var(--dim);margin-top:6px;">
        ⚡ 三者各需達 40%，總分排序取前 30 名
      </div>
    </div>
  </div>

  <!-- 狀態列 -->
  <div class="status-bar">
    <div style="display:flex;align-items:center;gap:8px;">
      <div class="status-dot" id="statusDot"></div>
      <div>
        <div style="font-size:.75rem;color:var(--txt);" id="statusText">載入中...</div>
        <div style="font-size:.65rem;color:var(--muted);" id="statusMeta"></div>
      </div>
    </div>
    <div class="hist-pills" id="histPills"></div>
  </div>

  <!-- 進行中 -->
  <div class="running-wrap" id="runningWrap">
    <div style="font-size:.82rem;font-weight:700;display:flex;align-items:center;gap:8px;">
      <span class="spin">⏳</span> 三合一選股執行中...
    </div>
    <div class="prog-bg"><div class="prog-bar" id="progBar"></div></div>
    <div style="font-size:.7rem;color:var(--muted);" id="progMsg">準備中...</div>
  </div>

  <!-- 結果 -->
  <div id="resultSection" style="display:none;">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;">
      <div>
        <div style="font-size:.9rem;font-weight:700;color:var(--white);" id="resultTitle">三合一選股結果</div>
        <div style="font-size:.65rem;color:var(--muted);" id="resultMeta"></div>
      </div>
    </div>
    <div class="stock-list" id="stockList"></div>
  </div>

  <!-- 空狀態 -->
  <div class="empty" id="emptyState">
    <div class="empty-icon">🎯</div>
    <div style="font-size:.82rem;line-height:1.6;">尚無分析資料<br>點「立即執行」或等待今晚 22:00</div>
  </div>

</div>

<div class="toast" id="toast"></div>

<script>
const API = location.hostname==='localhost' ? 'http://localhost:5000' : '';
let _pollTimer=null, _isRunning=false;

async function init() {
  await loadHistory();
  await loadLatest();
}

async function loadHistory() {
  try {
    const r = await fetch(`${API}/api/trinity/history`);
    const d = await r.json();
    const hist = d.history || [];
    document.getElementById('histPills').innerHTML = hist.slice(0,7).map((h,i)=>
      `<div class="hist-pill ${i===0?'active':''}" onclick="loadDate('${h.date}',this)">
        ${h.date.slice(5)} <span style="color:var(--gold);">${h.total_passed}支</span>
      </div>`
    ).join('');
  } catch(e){}
}

async function loadLatest(date) {
  try {
    const url = date ? `${API}/api/trinity/latest?date=${date}` : `${API}/api/trinity/latest`;
    const r = await fetch(url);
    if (!r.ok){showEmpty();return;}
    const d = await r.json();
    if (d.error){showEmpty();return;}
    renderResult(d);
  } catch(e){showEmpty();}
}

async function loadDate(date,el) {
  document.querySelectorAll('.hist-pill').forEach(p=>p.classList.remove('active'));
  if(el) el.classList.add('active');
  await loadLatest(date);
}

function renderResult(d) {
  const stocks = d.stocks || [];
  document.getElementById('emptyState').style.display='none';
  document.getElementById('resultSection').style.display='block';
  document.getElementById('resultTitle').textContent=`🎯 三合一選股 · ${d.date||''}`;
  document.getElementById('resultMeta').textContent=
    `掃描 ${d.total_scanned} 支 · ${d.total_passed} 支三者達標 · ${d.time||''}`;
  document.getElementById('statusText').textContent=`上次執行：${d.time||'—'}`;
  document.getElementById('statusMeta').textContent=
    `${d.total_scanned} 支掃描 → ${d.total_passed} 支達標`;

  if (!stocks.length){
    document.getElementById('stockList').innerHTML=
      `<div class="empty"><div class="empty-icon">😶</div>
       <div>今日無股票三者同時達標</div></div>`;
    return;
  }

  document.getElementById('stockList').innerHTML = stocks.map((s,i)=>{
    const up = s.chg_pct >= 0;
    const fd = s.fund_detail || {};
    const td = s.tech_detail || {};
    const cd = s.chip_detail || {};
    const fundPct = Math.round(s.fund_score/50*100);
    const techPct = Math.round(s.tech_score/30*100);
    const chipPct = Math.round(s.chip_score/20*100);

    return `<div class="stock-card" onclick="location.href='/analyze'">
      <div class="card-top">
        <div class="card-left">
          <div class="rank">#${i+1} ${s.sector||''}</div>
          <div class="name">${s.name}</div>
          <div class="code">${s.code}</div>
        </div>
        <div class="card-right">
          <div class="total-score">${s.total_score}分</div>
          <div class="score-label">總評分 /100</div>
          <div class="price-row">
            <span style="font-weight:700;font-family:'JetBrains Mono',monospace;color:${up?'var(--red)':'var(--grn)'};">
              ${s.price}元
            </span>
            <span style="font-size:.68rem;margin-left:4px;color:${up?'var(--red)':'var(--grn)'};">
              ${up?'+':''}${s.chg_pct}%
            </span>
          </div>
        </div>
      </div>

      <!-- 三維評分條 -->
      <div class="score-bars">
        <div class="score-bar-item">
          <div class="sbi-label">
            <span style="color:#f0b429;">📊 基本面</span>
            <span style="color:#f0b429;">${s.fund_score}/50</span>
          </div>
          <div class="sbi-track">
            <div class="sbi-fill" style="width:${fundPct}%;background:linear-gradient(90deg,#f0b429,#ff9800);"></div>
          </div>
        </div>
        <div class="score-bar-item">
          <div class="sbi-label">
            <span style="color:#3d8bff;">📈 技術面</span>
            <span style="color:#3d8bff;">${s.tech_score}/30</span>
          </div>
          <div class="sbi-track">
            <div class="sbi-fill" style="width:${techPct}%;background:linear-gradient(90deg,#3d8bff,#00bcd4);"></div>
          </div>
        </div>
        <div class="score-bar-item">
          <div class="sbi-label">
            <span style="color:#a855f7;">🏦 籌碼面</span>
            <span style="color:#a855f7;">${s.chip_score}/20</span>
          </div>
          <div class="sbi-track">
            <div class="sbi-fill" style="width:${chipPct}%;background:linear-gradient(90deg,#a855f7,#ec4899);"></div>
          </div>
        </div>
      </div>

      <!-- 指標細節 -->
      <div class="detail-grid">
        <div class="detail-box">
          <div class="db-label">月營收年增</div>
          <div class="db-val" style="color:${(fd.rev_yoy||0)>=0?'var(--red)':'var(--grn)'};">
            ${fd.rev_yoy!=null?(fd.rev_yoy>0?'+':'')+fd.rev_yoy+'%':'—'}
          </div>
        </div>
        <div class="detail-box">
          <div class="db-label">毛利率</div>
          <div class="db-val" style="color:${(fd.gross_margin||0)>=25?'var(--red)':'var(--txt)'};">
            ${fd.gross_margin!=null?fd.gross_margin+'%':'—'}
          </div>
        </div>
        <div class="detail-box">
          <div class="db-label">本益比</div>
          <div class="db-val" style="color:${(fd.per||0)<=20?'var(--red)':'var(--txt)'};">
            ${fd.per!=null?fd.per+'x':'—'}
          </div>
        </div>
        <div class="detail-box">
          <div class="db-label">KD</div>
          <div class="db-val" style="color:var(--gold);">
            ${td.k!=null?td.k+'/'+td.d:'—'}
          </div>
        </div>
        <div class="detail-box">
          <div class="db-label">MACD柱</div>
          <div class="db-val" style="color:${(td.macd_hist||0)>=0?'var(--red)':'var(--grn)'};">
            ${td.macd_hist!=null?(td.macd_hist>0?'+':'')+td.macd_hist:'—'}
          </div>
        </div>
        <div class="detail-box">
          <div class="db-label">法人買超</div>
          <div class="db-val" style="color:var(--pur);">
            ${s.inst_days}天
          </div>
        </div>
      </div>
    </div>`;
  }).join('');
}

function showEmpty() {
  document.getElementById('emptyState').style.display='block';
  document.getElementById('resultSection').style.display='none';
  document.getElementById('statusText').textContent='尚無資料';
  document.getElementById('statusMeta').textContent='等待首次執行';
}

async function triggerRun() {
  if (_isRunning) return;
  _isRunning=true;
  const btn=document.getElementById('runBtn');
  btn.disabled=true; btn.textContent='執行中...';
  document.getElementById('runningWrap').classList.add('show');
  document.getElementById('progBar').style.width='3%';
  showToast('三合一選股已啟動，約 90~120 分鐘完成');
  try {
    await fetch(`${API}/api/trinity/run`,{method:'POST'});
    startFakePoll();
  } catch(e){
    showToast('❌ 啟動失敗');
    resetRun();
  }
}

function startFakePoll() {
  let pct=3;
  const msgs=['掃描股票清單...','抓取歷史資料...','計算技術指標...','查詢法人籌碼...','分析基本面財報...','三者評分計算...','排序結果...'];
  let mi=0;
  _pollTimer=setInterval(async()=>{
    pct=Math.min(pct+(Math.random()*1.5),88);
    document.getElementById('progBar').style.width=pct+'%';
    document.getElementById('progMsg').textContent=msgs[mi%msgs.length];
    mi++;
    if (mi%15===0) {
      try {
        const r=await fetch(`${API}/api/trinity/latest`);
        const d=await r.json();
        if (!d.error) {
          const today=new Date().toISOString().slice(0,10);
          if ((d.date||'')===today) {
            clearInterval(_pollTimer);
            document.getElementById('progBar').style.width='100%';
            document.getElementById('progMsg').textContent='✅ 完成！';
            setTimeout(()=>{
              document.getElementById('runningWrap').classList.remove('show');
              resetRun();
              renderResult(d);
              loadHistory();
              showToast(`✅ 完成！${d.total_passed} 支達標`);
            },800);
          }
        }
      } catch(e){}
    }
  },3000);
  setTimeout(()=>{
    clearInterval(_pollTimer);
    loadLatest(); loadHistory();
    resetRun();
    document.getElementById('runningWrap').classList.remove('show');
  },130*60*1000);
}

function resetRun() {
  _isRunning=false;
  const btn=document.getElementById('runBtn');
  btn.disabled=false; btn.textContent='▶ 立即執行';
}

function showToast(msg) {
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),3000);
}

init();
</script>
</body>
</html>
