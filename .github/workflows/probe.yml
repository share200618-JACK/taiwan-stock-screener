name: API 欄位檢查（研究用）

on:
  workflow_dispatch:
    inputs:
      urls:
        description: "要檢查的網址（空白分隔）"
        required: true
      follow:
        description: "網頁的話順著 script 找 API（1＝是）"
        required: false
        default: "1"

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - name: 檢查
        env:
          PROBE_URLS: ${{ github.event.inputs.urls }}
          PROBE_FOLLOW: ${{ github.event.inputs.follow }}
        run: python probe_api.py
