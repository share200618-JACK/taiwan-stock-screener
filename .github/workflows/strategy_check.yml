name: 選股條件體檢

# 手動：GitHub → Actions →「選股條件體檢」→ Run workflow
#   cases    ：逐筆檢查實際買進的股票（約 10 分鐘）
#   backtest ：約 400 支、2019 年起回測券商選股條件與過濾條件（約 3 小時）
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "cases、backtest 或 nomad"
        required: true
        default: "cases"
      cases:
        description: "案例（代號,名稱,買進日,價格;…）空白＝預設清單"
        required: false
        default: ""
      light:
        description: "1＝回測不抓法人、融資（較快）"
        required: false
        default: "0"

concurrency:
  group: strategy-check-${{ github.event.inputs.mode }}   # 案例檢查不用等回測跑完
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: 還原研究資料快取（重跑不用再抓 FinMind）
        uses: actions/cache/restore@v4
        with:
          path: fm_cache
          key: fm-cache-${{ github.run_id }}
          restore-keys: fm-cache-

      - name: 選股條件體檢
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
          PYTHONUNBUFFERED: "1"
          CHECK_MODE: ${{ github.event.inputs.mode }}
          CHECK_CASES: ${{ github.event.inputs.cases }}
          CHECK_LIGHT: ${{ github.event.inputs.light }}
          FM_CACHE_DIR: fm_cache
        run: python strategy_check.py

      - name: 保存研究資料快取
        if: ${{ !cancelled() && hashFiles('fm_cache/**') != '' }}
        uses: actions/cache/save@v4
        with:
          path: fm_cache
          key: fm-cache-${{ github.run_id }}

      - name: 保存結果檔
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: strategy-check-${{ github.event.inputs.mode }}
          path: strategy_*_result.json
          if-no-files-found: ignore
          retention-days: 30
