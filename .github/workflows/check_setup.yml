name: 連線測試（FinMind＋Telegram）

# 更新 FINMIND_TOKEN 或 Telegram 設定後：GitHub → Actions →「連線測試」→ Run workflow
# 約 30 秒；Telegram 設好的話手機會收到測試結果，紀錄裡也看得到
on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: 檢查 FinMind 與 Telegram
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          PYTHONUNBUFFERED: "1"
        run: python check_setup.py
