name: 每日選股排程

on:
  # 已移除 GitHub 原生排程（不可靠且會與 cron-job.org 重複觸發）
  # 改由 cron-job.org 每交易日 14:35 透過 repository_dispatch 觸發
  workflow_dispatch:
  repository_dispatch:             # 外部 API 觸發（cron-job.org 用，可靠）
    types: [daily-screen]
  push:
    branches: [main]
    paths:
      - 'run_screen.py'
      - 'auto_analysis.py'
      - 'left_side.py'
      - 'strategy.py'
      - 'signal_alert.py'
      - 'div_alert.py'
      - 'watch_alert.py'
      - 'margin_call.py'
      - 'revenue.py'
      - 'notify.py'
      - 'daily_report.py'

# 同一時間只跑一個排程：上傳程式（push）觸發的和 14:35 的不會同時搶 FinMind 額度
concurrency:
  group: daily-screen
  cancel-in-progress: false

jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 300   # AI 分析＋左側選股補抓，FinMind 免費額度需較長時間
    env:
      PYTHONUNBUFFERED: "1"   # 紀錄即時輸出，時間戳才準（之前整批印出，看不出哪裡慢）

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: 還原月營收快取（每支股票每月只抓一次）
        uses: actions/cache/restore@v4
        with:
          path: rev_cache.json
          key: rev-cache-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: rev-cache-

      - name: 執行 AI 自動選股分析
        id: ai
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
        run: python auto_analysis.py

      - name: 持倉賣出提醒（Telegram）
        id: sell
        if: ${{ !cancelled() }}   # 前一步失敗也照跑
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: python sell_alert.py

      - name: 買進訊號（Telegram）
        id: signals
        if: ${{ !cancelled() }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          NOMAD_ON: ${{ vars.NOMAD_ON }}
          PYTHONUNBUFFERED: "1"
        run: python signal_alert.py

      - name: 還原存股日K與財報快取
        if: ${{ !cancelled() }}
        uses: actions/cache/restore@v4
        with:
          path: div_cache.json
          key: div-cache-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: div-cache-

      - name: 存股＋營運動能（Telegram）
        id: div
        if: ${{ !cancelled() }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          PYTHONUNBUFFERED: "1"
        run: python div_alert.py

      - name: 融資追繳／斷頭統計（給日報）
        id: mcall
        if: ${{ !cancelled() }}
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          MCALL_MODE: report
          PYTHONUNBUFFERED: "1"
        run: python margin_call.py

      - name: 追蹤股提醒（Telegram）
        id: watch
        if: ${{ !cancelled() }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          PYTHONUNBUFFERED: "1"
        run: python watch_alert.py

      - name: 保存存股快取
        if: ${{ !cancelled() && hashFiles('div_cache.json') != '' }}
        uses: actions/cache/save@v4
        with:
          path: div_cache.json
          key: div-cache-${{ github.run_id }}-${{ github.run_attempt }}

      - name: 保存月營收快取
        if: ${{ !cancelled() && hashFiles('rev_cache.json') != '' }}
        uses: actions/cache/save@v4
        with:
          path: rev_cache.json
          key: rev-cache-${{ github.run_id }}-${{ github.run_attempt }}

      - name: 還原績效快取（已到期的樣本不用重抓）
        if: ${{ !cancelled() }}
        uses: actions/cache/restore@v4
        with:
          path: perf_cache.json
          key: perf-cache-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: perf-cache-

      - name: 計算 AI／左側選股實戰績效（最後跑，不影響賣出提醒）
        id: perf
        if: ${{ !cancelled() }}   # 前一步失敗也照跑
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}   # 選股條件自動調整時通知
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: python performance.py

      - name: 保存績效快取
        if: ${{ !cancelled() && hashFiles('perf_cache.json') != '' }}
        uses: actions/cache/save@v4
        with:
          path: perf_cache.json
          key: perf-cache-${{ github.run_id }}-${{ github.run_attempt }}

      - name: 台股正2 × 波浪理論分析
        id: wave
        if: ${{ !cancelled() }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
        run: python etf_wave.py

      - name: 每日 Telegram 報告
        if: always()   # 前面失敗、逾時也發，才知道哪裡出問題
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          AI_OUTCOME: ${{ steps.ai.outcome }}
          SELL_OUTCOME: ${{ steps.sell.outcome }}
          SIGNALS_OUTCOME: ${{ steps.signals.outcome }}
          DIV_OUTCOME: ${{ steps.div.outcome }}
          WATCH_OUTCOME: ${{ steps.watch.outcome }}
          MCALL_OUTCOME: ${{ steps.mcall.outcome }}
          PERF_OUTCOME: ${{ steps.perf.outcome }}
          WAVE_OUTCOME: ${{ steps.wave.outcome }}
        run: python daily_report.py
