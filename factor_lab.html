<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>因子實驗室</title>
<style>
:root{
  --bg:#0a0c10;--s1:#111318;--s2:#161b25;--s3:#1e2330;
  --bd:#252a38;--gold:#f0b429;--gold2:#ffe080;
  --red:#ff4d5e;--grn:#27d981;--blu:#3d8bff;
  --pur:#a855f7;--txt:#e4eaf5;--dim:#6a748f;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--txt);font-family:'Noto Sans TC',system-ui,sans-serif;padding-bottom:40px;}
.w{max-width:900px;margin:0 auto;padding:0 14px;}
.topbar{display:flex;align-items:center;gap:14px;padding:14px 0;flex-wrap:wrap;}
.tlogo{display:flex;align-items:center;gap:8px;text-decoration:none;color:var(--txt);}
.tlogo-icon{width:36px;height:36px;border-radius:9px;background:linear-gradient(135deg,#a855f7,#7c3aed);display:flex;align-items:center;justify-content:center;font-size:1.1rem;}
.tlogo-text{font-size:1rem;font-weight:800;}
.nav-links{display:flex;gap:4px;flex-wrap:wrap;}
.nav-link{padding:5px 10px;border-radius:6px;font-size:.7rem;font-weight:600;text-decoration:none;color:var(--dim);}
.nav-link:hover{color:#fff;background:rgba(255,255,255,.07);}
.nav-link.active{color:#fff;background:rgba(168,85,247,.25);}
.card{background:var(--s1);border:1px solid var(--bd);border-radius:14px;padding:18px;margin-bottom:16px;}
.title{font-size:1.05rem;font-weight:800;margin-bottom:6px;}
.sub{font-size:.78rem;color:var(--dim);line-height:1.6;margin-bottom:14px;}
label{font-size:.75rem;color:var(--dim);display:block;margin-bottom:6px;}
select:disabled{opacity:.55;}
select{width:100%;padding:11px;background:var(--s3);border:1px solid var(--bd);border-radius:9px;color:var(--txt);font-size:.9rem;}
.row{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:14px;}
.row>div{flex:1;min-width:140px;}
.run-btn{width:100%;padding:13px;border:none;border-radius:10px;background:linear-gradient(135deg,#a855f7,#7c3aed);color:#fff;font-size:.95rem;font-weight:700;cursor:pointer;}
.run-btn:disabled{opacity:.5;cursor:not-allowed;}
.prog-wrap{display:none;margin-top:14px;}
.prog-bar{height:8px;background:var(--s3);border-radius:4px;overflow:hidden;}
.prog-fill{height:100%;background:linear-gradient(90deg,#a855f7,#3d8bff);width:0;transition:width .3s;}
.prog-msg{font-size:.72rem;color:var(--dim);margin-top:6px;text-align:center;}
.grp{display:flex;gap:10px;margin:14px 0;}
.grp-card{flex:1;background:var(--s2);border:1px solid var(--bd);border-radius:11px;padding:14px;text-align:center;}
.grp-lbl{font-size:.7rem;color:var(--dim);margin-bottom:6px;}
.grp-ret{font-size:1.35rem;font-weight:800;font-family:'JetBrains Mono',monospace;}
.grp-meta{font-size:.62rem;color:var(--dim);margin-top:6px;}
.verdict{border-radius:11px;padding:14px;margin-top:14px;font-size:.85rem;line-height:1.6;}
.v-add{background:rgba(27,196,125,.1);border:1px solid rgba(27,196,125,.3);color:var(--grn);}
.v-skip{background:rgba(255,77,94,.08);border:1px solid rgba(255,77,94,.25);color:var(--red);}
.v-reverse{background:rgba(240,180,41,.08);border:1px solid rgba(240,180,41,.25);color:var(--gold);}
.stat-line{font-size:.75rem;color:var(--dim);text-align:center;margin-top:10px;font-family:'JetBrains Mono',monospace;}
</style>
</head>
<body>
<div class="w">
<div class="topbar">
  <a href="/" class="tlogo"><div class="tlogo-icon">🧪</div><span class="tlogo-text">因子實驗室</span></a>
  <nav class="nav-links">
    <a href="/" class="nav-link">📊 儀表板</a>
    <a href="/analyze" class="nav-link">🤖 AI分析</a>
    <a href="/backtest" class="nav-link">📈 回測</a>
    <a href="/watchlist" class="nav-link">👁️ 追蹤</a>
    <a href="/factor-lab" class="nav-link active">🧪 因子實驗室</a>
    <a href="/etf-wave" class="nav-link">🌊 正2波浪</a>
  </nav>
</div>

<div class="card">
  <div class="title">🧪 因子預測力驗證</div>
  <div class="sub">
    驗證某個因子或整套選股規則到底有沒有預測力，再決定要不要相信它、加進模型。<br>
    因子值一律用「當天收盤拿得到的資料」（法人/融資用前一交易日、財報等公告後），不偷看未來。<br>
    <strong style="color:var(--gold);">先驗證、有效再用</strong>：「籌碼左側」目前標示為觀察中，就是等這裡和實盤追蹤的結果。
  </div>

  <div class="row">
    <div>
      <label>選擇因子</label>
      <select id="factor" onchange="onFactorChange()">
        <optgroup label="左側交易">
          <option value="left_chip" selected>籌碼左側（整套規則）</option>
          <option value="bias20">MA20 乖離率</option>
          <option value="rsi6">RSI(6)</option>
          <option value="margin_chg10">融資10日變化</option>
          <option value="inst_in_decline">跌勢中法人買超</option>
        </optgroup>
        <optgroup label="其他">
          <option value="foreign_net">外資近5日買超</option>
          <option value="margin_usage">融資使用率</option>
          <option value="gross_margin">毛利率（季報）</option>
        </optgroup>
      </select>
      <div id="factorHint" style="font-size:.66rem;color:var(--dim);margin-top:6px;line-height:1.5;"></div>
    </div>
    <div>
      <label>持有天數</label>
      <select id="hold">
        <option value="5">5 個交易日</option>
        <option value="10">10 個交易日</option>
        <option value="15">15 個交易日（AI 模型預測天數）</option>
        <option value="20" selected>20 個交易日（左側時間停損）</option>
      </select>
    </div>
  </div>

  <div class="row">
    <div>
      <label>驗證範圍</label>
      <select id="scope" onchange="onScopeChange()">
        <option value="market" selected>全市場面板（80 支 × 約 2 年，樣本大）</option>
        <option value="portfolio">我的 AI 推薦股（對焦選股優化）</option>
      </select>
      <div id="scopeHint" style="font-size:.66rem;color:var(--dim);margin-top:6px;line-height:1.5;"></div>
      <div id="timeWarn" style="display:none;font-size:.68rem;color:var(--gold);margin-top:6px;line-height:1.5;">
        ⚠️ 現在是每日排程時段（約 14:30~17:30），排程正在用 FinMind 額度，驗證可能中途額度不足，建議晚點再跑。
      </div>
    </div>
  </div>

  <div class="row">
    <div>
      <label>驗證模式</label>
      <select id="mode" onchange="onModeChange()">
        <option value="winrate">勝率對照（用因子篩選，勝率能否提高）</option>
        <option value="quantile">報酬對比（高/中/低三組報酬）</option>
      </select>
      <div id="modeHint" style="font-size:.66rem;color:var(--dim);margin-top:6px;line-height:1.5;"></div>
    </div>
  </div>

  <button class="run-btn" id="runBtn" onclick="startValidation()">🔬 開始驗證</button>

  <div class="prog-wrap" id="progWrap">
    <div class="prog-bar"><div class="prog-fill" id="progFill"></div></div>
    <div class="prog-msg" id="progMsg">準備中...</div>
  </div>
</div>

<div class="card" id="resultCard" style="display:none;">
  <div class="title" id="resultTitle"></div>
  <div class="sub" id="resultNote" style="margin-bottom:0;"></div>
  <div class="grp">
    <div class="grp-card">
      <div class="grp-lbl">低組</div>
      <div class="grp-ret" id="gLowRet"></div>
      <div class="grp-meta" id="gLowMeta"></div>
    </div>
    <div class="grp-card">
      <div class="grp-lbl">中組</div>
      <div class="grp-ret" id="gMidRet"></div>
      <div class="grp-meta" id="gMidMeta"></div>
    </div>
    <div class="grp-card">
      <div class="grp-lbl">高組</div>
      <div class="grp-ret" id="gHighRet"></div>
      <div class="grp-meta" id="gHighMeta"></div>
    </div>
  </div>
  <div class="stat-line" id="statLine"></div>
  <div class="verdict" id="verdict"></div>
</div>

</div>

<script>
const API = location.hostname==='localhost' ? 'http://localhost:5000' : '';
const RULE_FACTORS = ['left_chip'];
const FACTOR_HINT = {
  left_chip: '近20日跌≥10%、融資10日減≥10%、法人10日買超且≥5天、仍在MA60下、日均量≥300張。比較「符合條件」與「不符合」之後的報酬。',
  bias20: '收盤離 MA20 多遠（%）。負得越多＝跌得越超過。左側看法：低組應該較會反彈。',
  rsi6: '6 日 RSI。低於 20 常被視為超賣。左側看法：低組應該較會反彈。',
  margin_chg10: '融資餘額 10 日變化（%）。負＝散戶退場、籌碼沉澱。左側看法：低組較好。',
  inst_in_decline: '只看近20日跌≥5%的股票：法人10日買超佔成交量比例（%）。左側看法：高組較好。',
  foreign_net: '外資近5日買超（張，取前一交易日）。',
  margin_usage: '融資使用率（%，取前一交易日）。',
  gross_margin: '最近一季已公布的毛利率（%）。',
};

function isRule() { return RULE_FACTORS.includes(document.getElementById('factor').value); }

function onFactorChange() {
  const f = document.getElementById('factor').value;
  document.getElementById('factorHint').textContent = FACTOR_HINT[f] || '';
  const mode = document.getElementById('mode');
  if (isRule()) { mode.value = 'winrate'; mode.disabled = true; }
  else mode.disabled = false;
  onModeChange();
}

function onModeChange() {
  const mode = document.getElementById('mode').value;
  const hint = document.getElementById('modeHint');
  if (isRule()) {
    hint.textContent = '整套規則只有「符合／不符合」兩種，固定用勝率對照。';
  } else if (mode === 'winrate') {
    hint.textContent = '依因子中位數分「高於／低於」兩組，比較勝率——回答「用這因子篩選能否調高勝率」。';
  } else {
    hint.textContent = '把股票依因子值分高/中/低三組，比較報酬——回答「因子本身有沒有預測力」。';
  }
}

function onScopeChange() {
  const scope = document.getElementById('scope').value;
  const hint = document.getElementById('scopeHint');
  if (scope === 'market') {
    hint.innerHTML = '全市場隨機 80 支（同一天固定同一批）× 約 2 年，每檔每隔「持有天數」取一個不重疊的決策點；報酬扣掉同期所有樣本的平均（去掉大盤漲跌），已排除日均量 &lt; 300 張的冷門股。<br>首次約需 <strong style="color:var(--gold);">3-6 分鐘</strong>（每支要抓 1~3 種資料），同一天再跑其他因子會快很多。';
  } else {
    hint.textContent = '用你推薦過的股票（推薦日收盤進場）驗證，直接回答「這因子能否幫我的推薦再篩一次」。報酬為原始報酬。';
  }
}

function checkTimeWarn() {
  const tw = new Date(Date.now() + (new Date().getTimezoneOffset() + 480) * 60000);
  const m = tw.getHours() * 60 + tw.getMinutes(), wd = tw.getDay();
  document.getElementById('timeWarn').style.display =
    (wd >= 1 && wd <= 5 && m >= 14*60+30 && m <= 17*60+30) ? 'block' : 'none';
}

async function startValidation() {
  const factor = document.getElementById('factor').value;
  const hold   = document.getElementById('hold').value;
  const scope  = document.getElementById('scope').value;
  const mode   = isRule() ? 'winrate' : document.getElementById('mode').value;
  const btn = document.getElementById('runBtn');
  btn.disabled = true; btn.textContent = '⏳ 驗證中...';
  document.getElementById('progWrap').style.display = 'block';
  document.getElementById('resultCard').style.display = 'none';
  setProg(0, '啟動驗證...');

  try {
    const r = await fetch(`${API}/api/factor/validate`, {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({factor, hold:parseInt(hold), scope, mode})
    });
    const d = await r.json();
    if (d.error) throw new Error(d.error);
    pollProgress(d.task_id);
  } catch(e) {
    setProg(0, '❌ ' + e.message);
    resetBtn();
  }
}

async function pollProgress(taskId) {
  try {
    const r = await fetch(`${API}/api/factor/progress/${taskId}`);
    const d = await r.json();
    if (r.status === 404) { setProg(0, '❌ 任務不見了（伺服器可能重啟），請重新驗證'); resetBtn(); return; }
    setProg(d.pct || 0, d.msg || '處理中...');
    if (d.done) {
      resetBtn();
      if (d.error) { setProg(0, '❌ ' + d.error); return; }
      renderResult(d.result);
      return;
    }
    setTimeout(() => pollProgress(taskId), 1500);
  } catch(e) {
    setTimeout(() => pollProgress(taskId), 2000);
  }
}

function setProg(pct, msg) {
  document.getElementById('progFill').style.width = pct + '%';
  document.getElementById('progMsg').textContent = msg;
}
function resetBtn() {
  const btn = document.getElementById('runBtn');
  btn.disabled = false; btn.textContent = '🔬 開始驗證';
}
const sg = v => (v >= 0 ? '+' : '') + v;

function headerFor(res, extra) {
  const scopeLabel = res.scope === 'market' ? '全市場面板' : '我的推薦';
  document.getElementById('resultTitle').textContent =
    `${res.factor_name}${extra||''} — 持有 ${res.hold} 日 · ${scopeLabel}（樣本 ${res.n} 筆）`;
  const notes = [];
  if (res.demeaned) notes.push('報酬為「超額報酬」＝該股報酬 − 同一天所有樣本的平均報酬；勝率＝跑贏同期平均的比例。');
  if (res.stocks_used != null) notes.push(`實際用到 ${res.stocks_used}/${res.stocks_planned} 支股票。`);
  if (res.quota_hit) notes.push('<span style="color:var(--gold);">⚠️ 途中 FinMind 額度用完，只用已抓到的部分計算，結論參考就好。</span>');
  document.getElementById('resultNote').innerHTML = notes.join('<br>');
}

function renderWinrate(res) {
  const card = document.getElementById('resultCard');
  card.style.display = 'block';
  document.getElementById('progWrap').style.display = 'none';
  headerFor(res, ' 勝率對照');
  const passLbl = res.is_rule ? '✅ 符合策略條件' : `✅ 高於中位數（≥${res.median}）`;
  const failLbl = res.is_rule ? '❌ 不符合' : `❌ 低於中位數`;
  const rawNote = g => res.demeaned ? `<br>原始報酬 ${sg(res[g+'_raw'])}%` : '';
  const grpDiv = document.querySelector('.grp');
  grpDiv.style.display = 'flex';
  grpDiv.innerHTML = `
    <div class="grp-card" style="border-color:rgba(27,196,125,.4);">
      <div class="grp-lbl">${passLbl}</div>
      <div class="grp-ret" style="color:${res.pass_win>=res.fail_win?'var(--grn)':'var(--red)'};">${res.pass_win}%</div>
      <div class="grp-meta">勝率 · 平均${res.demeaned?'超額':''}報酬 ${sg(res.pass_avg)}% · n=${res.pass_n}${rawNote('pass')}</div>
    </div>
    <div class="grp-card" style="border-color:rgba(255,77,94,.4);">
      <div class="grp-lbl">${failLbl}</div>
      <div class="grp-ret">${res.fail_win}%</div>
      <div class="grp-meta">勝率 · 平均${res.demeaned?'超額':''}報酬 ${sg(res.fail_avg)}% · n=${res.fail_n}${rawNote('fail')}</div>
    </div>`;

  document.getElementById('statLine').innerHTML =
    `整體勝率 ${res.all_win}% → ${res.is_rule?'符合條件':'篩選後'} <strong style="color:${res.win_lift>=0?'var(--grn)':'var(--red)'}">${res.pass_win}%</strong>（${sg(res.win_lift)}%）　|　t值 ${res.t}　|　${Math.abs(res.t)>1.96?'顯著 ✓':'不顯著 ✗'}`;

  const v = document.getElementById('verdict');
  const what = res.is_rule ? `符合「${res.factor_name}」條件` : `「${res.factor_name}高於中位數」`;
  if (res.verdict === 'improve') {
    v.className = 'verdict v-add';
    v.innerHTML = `✅ <strong>有效</strong><br>${what}的股票，持有 ${res.hold} 日勝率 ${res.pass_win}%，比整體 ${res.all_win}% 高 ${res.win_lift}%，且統計顯著。` +
      (res.is_rule ? `<br>可以開始參考 AI 分析頁的左側名單，但仍建議看實盤追蹤（回測頁）累積到 30 筆以上再加碼使用。` : `<br>可考慮當作額外篩選條件。`);
  } else if (res.verdict === 'worsen') {
    v.className = 'verdict v-reverse';
    v.innerHTML = `⚠️ <strong>反而較差</strong><br>${what}的股票表現比不符合的還差（統計顯著）。` +
      (res.is_rule ? '這代表目前「跌深＋籌碼」的條件在這段期間抓到的多半還沒跌完，左側名單請先不要照做。' : '可考慮反向使用，或不要用這因子篩選。');
  } else {
    v.className = 'verdict v-skip';
    v.innerHTML = `❌ <strong>沒有明顯差別</strong><br>兩組差異不顯著（${res.pass_win}% vs ${res.fail_win}%）。` +
      (res.is_rule ? '目前證據不足以說明這套左側條件有優勢，名單繼續標「觀察中」。' : '用這因子篩選無法有效提高勝率。') +
      `<br><span style="color:var(--dim);font-size:.72rem;">可換不同持有天數、或過一陣子樣本變多再驗證。</span>`;
  }
}

const QUANT_HTML = `
    <div class="grp-card"><div class="grp-lbl">低組</div><div class="grp-ret" id="gLowRet"></div><div class="grp-meta" id="gLowMeta"></div></div>
    <div class="grp-card"><div class="grp-lbl">中組</div><div class="grp-ret" id="gMidRet"></div><div class="grp-meta" id="gMidMeta"></div></div>
    <div class="grp-card"><div class="grp-lbl">高組</div><div class="grp-ret" id="gHighRet"></div><div class="grp-meta" id="gHighMeta"></div></div>`;

function renderResult(res) {
  if (res.enough && res.mode === 'winrate') { renderWinrate(res); return; }
  const card = document.getElementById('resultCard');
  card.style.display = 'block';
  document.getElementById('progWrap').style.display = 'none';
  const grpDiv = document.querySelector('.grp');

  if (!res.enough) {
    document.getElementById('resultTitle').textContent = '樣本不足';
    document.getElementById('resultNote').innerHTML = '';
    grpDiv.style.display = 'none';
    document.getElementById('statLine').textContent = '';
    const v = document.getElementById('verdict');
    v.className = 'verdict v-skip';
    if (res.is_rule && res.n >= 20) {
      v.innerHTML = `⚠️ 共 ${res.n} 個決策點，但符合「${res.factor_name}」條件的只有 ${res.pass_n||0} 筆（需至少 15 筆）。<br>條件很嚴格、這段期間觸發次數太少，結論不可靠。可改用「全市場面板」或換持有天數再試。`;
    } else {
      v.innerHTML = `⚠️ 有效樣本只有 ${res.n} 筆（需至少 20 筆）<br>結論不可靠，請改用全市場面板，或累積更多每日推薦資料後再驗證。`;
    }
    return;
  }

  grpDiv.style.display = 'flex';
  grpDiv.innerHTML = QUANT_HTML;
  headerFor(res, '');

  const fill = (pre, g) => {
    const col = g.avg >= 0 ? 'var(--red)' : 'var(--grn)';
    document.getElementById(pre+'Ret').textContent = sg(g.avg) + '%';
    document.getElementById(pre+'Ret').style.color = col;
    document.getElementById(pre+'Meta').innerHTML = `${g.lo}~${g.hi}<br>勝率${g.win}% · n=${g.n}` + (res.demeaned ? `<br>原始 ${sg(g.raw)}%` : '');
  };
  fill('gLow', res.low); fill('gMid', res.mid); fill('gHigh', res.high);

  document.getElementById('statLine').textContent =
    `高組 vs 低組${res.demeaned?'超額':''}報酬差異 ${sg(res.diff)}%   |   t值 ${res.t}   |   ${Math.abs(res.t)>1.96?'統計顯著 ✓':'不顯著 ✗'}`;

  const v = document.getElementById('verdict');
  if (res.verdict === 'add') {
    v.className = 'verdict v-add';
    v.innerHTML = `✅ <strong>高組較好</strong><br>${res.factor_name}越高，之後報酬越好（統計顯著），此因子有預測力。`;
  } else if (res.verdict === 'reverse') {
    v.className = 'verdict v-reverse';
    v.innerHTML = `⚠️ <strong>低組較好（反向）</strong><br>${res.factor_name}越低，之後報酬反而越好（統計顯著）。` +
      (['bias20','rsi6','margin_chg10'].includes(res.factor) ? '這正是左側交易的看法（跌越深／散戶退越多越會反彈）。' : '可考慮反向使用。');
  } else {
    v.className = 'verdict v-skip';
    v.innerHTML = `❌ <strong>沒有明顯預測力</strong><br>高低組報酬差異不顯著，${res.factor_name}在這批樣本中看不出效果，加入恐增加雜訊。`;
  }
}

onFactorChange(); onScopeChange(); checkTimeWarn();
</script>
